# Spec 066 (T001, research R3): `sherpa-onnx-sys` would download its native libraries without a
# checksum. It takes them from here instead; `node scripts/fetch-sherpa-onnx.ts` puts them there
# after checking each SHA-256 (pins in scripts/lib/sherpaOnnxArchives.ts).
[env]
SHERPA_ONNX_ARCHIVE_DIR = { value = "src-tauri/target/sherpa-onnx-archives", relative = true }
# Spec 070 US5: llama.cpp's C++ standard-library headers use std::filesystem, which is available from
# macOS 10.15. Keep cc-rs and rustc aligned with the app's minimumSystemVersion in tauri.conf.json.
MACOSX_DEPLOYMENT_TARGET = { value = "10.15", force = false }
# Spec 070 R3: ggml for the x86-64 AVX2 baseline. Without these switches it builds its plain C kernels,
# which run Qwen3 4B several times slower; a processor without them gets no llama.cpp (`llm/llamacpp/cpu.rs`).
# Off x86 ggml ignores them. A target dir built before a change keeps its ggml until
# `cargo clean -p llama-cpp-sys-2`: the sys crate does not watch GGML_* variables it has not seen yet.
GGML_AVX = "ON"
GGML_AVX2 = "ON"
GGML_FMA = "ON"
GGML_F16C = "ON"
GGML_BMI2 = "ON"
# Spec 070 T035: llama.cpp's build script builds for Android API 28 unless told otherwise; the app's
# `minSdk` is 26 (spec 043).
ANDROID_API_LEVEL = "26"
