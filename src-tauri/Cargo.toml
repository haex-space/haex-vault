[package]
name = "haex-vault"
version = "2.17.0"
description = "Build once. Run everywhere. Sync automatically"
authors = ["Haex"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
# Enables test-only Tauri commands used by haex-e2e-tests companion specs
# to construct multi-peer adversarial scenarios (forged shared-space delete
# signals, cross-space suppression attacks, MLS committer-capability attack
# commits — mls::e2e_hooks) that a legit peer cannot emit through the normal
# UI/sync path. NEVER enable in binaries shipped to end users — the commands
# bypass wire-side authorization by design.
e2e-hooks = []
# Embeds a W3C WebDriver automation server (tauri-plugin-webdriver) for
# macOS E2E builds only. tauri-driver has no WKWebView support, so macOS
# E2E automation needs this in-process alternative instead. NEVER enable
# in binaries shipped to end users — see haex-e2e-tests for the consumer.
e2e-webdriver-macos = ["dep:tauri-plugin-webdriver"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "haex_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1.0"
tauri-build = { version = "2.5.5", features = [] }
serde = { version = "1.0", features = ["derive"] }

[dependencies]
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }
base64 = "0.23"
bs58 = "0.5"
ed25519-dalek = "3.0"
fs_extra = "1.3"
hex = "0.4"
lazy_static = "1.5"
mime = "0.3"
mime_guess = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
blake3 = "1.5"
sqlparser = { version = "0.62", features = ["visitor"] }
tauri = { version = "2.11", features = ["protocol-asset", "devtools", "test"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.4.5"
tauri-plugin-http = "2.5.9"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.4"
tauri-plugin-os = "2.3"
tauri-plugin-persisted-scope = "2.3.7"
tauri-plugin-store = "2.4.3"
tauri-plugin-deep-link = "2.4.9"
# Per-vault file locking: prevents two instances from opening the same DB
# concurrently. `tauri-plugin-single-instance` used to enforce single-instance
# at the app level (blocking even different vaults); we moved to per-DB locks
# so independent vaults can run side-by-side, but the same vault still can't
# be opened twice (which would corrupt CRDT HLC + SQLite WAL state).
fs2 = "0.4"
thiserror = "2.0"
ts-rs = { version = "12.0", features = ["serde-compat"] }
uhlc = "0.9"
url = "2.5"
uuid = { version = "1.23", features = ["v4"] }
zip = "8.6"
rusqlite = { version = "0.40", features = [
  "load_extension",
  "bundled-sqlcipher-vendored-openssl",
  "functions",
  "hooks",
] }
regex = "1.12"
tokio-tungstenite = "0.30.0"
futures-util = { version = "0.3", default-features = false, features = [
  "sink",
  "std",
] }
x25519-dalek = { version = "3.0", features = ["static_secrets"] }
aes-gcm = "0.11"
hkdf = "0.12"
rand = "0.10"
# Byte-buffer scrubbing on drop. Used for `AppState::vault_key` transport
# slot — a 32-byte own-vault key held in memory only for the vault's open
# lifetime, cleared on close. `Zeroizing<[u8; 32]>` wipes the buffer when
# `Drop` runs — normal `close_database` and unwinding panics. Forced
# termination (`panic = "abort"`, SIGKILL, OOM, hardware fault) skips
# destructors and cannot guarantee scrubbing; treat this as defence in
# depth, not a total-lifecycle guarantee.
zeroize = "1.8"
# FileSync dependencies
chacha20poly1305 = "0.11"
async-trait = "0.1"
# S3 backend - using native-tls (works on Android without cmake/aws-lc-rs issues)
rust-s3 = { version = "0.37", default-features = false, features = [
  "tokio-native-tls",
  "fail-on-err",
  "tags",
] }
# Supabase Storage backend (HTTP client)
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "native-tls",
] }

# Peer Storage (P2P file sharing via iroh/QUIC)
iroh = { version = "1.0.1", default-features = false, features = ["tls-ring"] }
iroh-mdns-address-lookup = "0.4"

# MLS (RFC 9420) - Group key management
openmls = "0.9.0"
openmls_rust_crypto = "0.6.0"
openmls_traits = "0.6.0"
openmls_basic_credential = "0.6.0"

# Time utilities
time = "0.3"

# Tracing capture for iroh's internal events (relay actor, socket
# transport, connection lifecycle). Without a subscriber installed
# iroh's tracing-crate emissions go to /dev/null, leaving us blind
# to the root cause of "Endpoint is closed" failures we cannot
# trigger from our own code.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# PTY support for shell/terminal (desktop + android via cfg)
portable-pty = "0.9"
# `compat` enables tokio↔futures-io adapters used by the core mail
# module to bridge tokio TLS streams into async-imap (which uses
# futures-io). The crate already had tokio-util as a dep without
# features — adding it here doesn't break existing usages.
tokio-util = { version = "0.7.18", features = ["compat"] }
tempfile = "3.27"

# Mail (IMAP/SMTP) — used by core mail module (src/mail/) and the
# extension-facing wrapper (src/extension/mail/). native-tls is chosen for
# consistency with reqwest/rust-s3 above; async-imap is generic over the
# TLS stream so we wrap a tokio TcpStream with tokio-native-tls.
async-imap = "0.11"
# async-imap returns `imap_proto` types from its public API (Envelope,
# Address) without re-exporting them — declare it directly so we can
# name those types in our wrapper code.
imap-proto = "0.16"
native-tls = "0.2"
tokio-native-tls = "0.3"
lettre = { version = "0.11", default-features = false, features = [
  "tokio1-native-tls",
  "smtp-transport",
  "builder",
  # Without "hostname", lettre's EHLO greets the server as "127.0.0.1",
  # which many providers reject or rate-limit. The feature pulls in the
  # `hostname` crate so EHLO uses the local FQDN.
  "hostname",
] }
mail-parser = "0.11"

# SigV4 request signer for IAM API calls (S3-bucket-sharing feature).
# We use aws-sigv4 (not the full aws-sdk-iam) to keep the dep tree lean and
# — importantly — free of `aws-lc-rs`, which requires cmake and breaks
# Android builds. sign-http-only feature keeps transitive smithy deps to a
# minimum; requests go through the existing `reqwest` client.
aws-sigv4 = { version = "1", default-features = false, features = ["sign-http", "http1"] }
# Peer deps of aws-sigv4 — `Credentials::new` produces an `Identity` (via
# `From<Credentials> for Identity`) which `SigningParams::builder` requires.
# Kept explicit so builds don't rely on transitive resolution.
aws-credential-types = "1"
aws-smithy-runtime-api = "1"



[target.'cfg(not(target_os = "android"))'.dependencies]
trash = "5.2"
notify = "8.2"
notify-debouncer-mini = "0.7"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"

[target.'cfg(target_os = "macos")'.dependencies]
# Version pinned per github.com/Choochmeque/tauri-webdriver docs; re-check
# against the crate's published docs before bumping. Optional + feature-gated
# (see e2e-webdriver-macos above) so it never ships in production builds.
tauri-plugin-webdriver = { version = "0.2", optional = true }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometry = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-fs = "28"
# tao 0.35 (Tauri 2.11) dropped its ndk-context init step that earlier
# tao versions performed in onActivityCreate. Hickory-resolver (pulled
# in by iroh for DNS) panics with "android context was not initialized"
# when iroh tries to resolve the relay URL. We reinstate the init via
# a tiny JNI shim called from MainActivity.onCreate (see
# `Java_space_haex_vault_MainActivity_initializeNdkContext` in lib.rs).
ndk-context = "0.1"
jni = "0.22"

[dev-dependencies]
futures = "0.3"

# Production-code hygiene per docs/plans/2026-06-13-critical-failure-pattern.md
# Phase 1. `unwrap_used` denied so every unwrap is a deliberate decision —
# tests opt back in via `#![cfg_attr(test, allow(clippy::unwrap_used))]` at
# the top of every #[cfg(test)] module (or the `tests/*.rs` file itself).
# `expect_used` warns rather than denies — `expect("invariant: …")` is the
# escape hatch for genuinely-unreachable cases, but each one should still
# be reviewed.
[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
