[package]
name = "holzi"
default-run = "holzi"
version = "0.1.0"
description = "Portable personal-agent Tauri app with embedded encrypted store"
authors = ["haexmas"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/haexmas/holzi"
edition = "2021"
rust-version = "1.95"

[lib]
name = "holzi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "e2e_nostr_relay"
path = "src/bin/e2e_nostr_relay.rs"
required-features = ["e2e"]

[[bin]]
name = "e2e_bridge_client"
path = "src/bin/e2e_bridge_client.rs"
required-features = ["e2e"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[features]
# Default enables local inference on CPU and voice control so a fresh
# `cargo build` yields a working Chat pipeline plus mic dictation out of the
# box. Set `--no-default-features` to skip mistralrs/candle and cpal entirely
# while iterating on unrelated code.
default = ["llm-cpu", "voice"]

# Local inference via mistralrs 0.8.x (in-process, per plan §"Lokale Inferenz").
# Also gates the local Whisper STT adapter (spec 008): it shares the same
# candle-core/candle-nn runtime mistralrs already pulls in, via
# candle-transformers, so it is pinned to llm-cpu rather than its own
# feature. A `voice`-only build (no llm-cpu) keeps the STT trait, audio
# capture, and interrupt matcher compilable but has no local transcription
# backend at runtime (`SttError::LocalSttUnavailable`).
llm-cpu = [
    "dep:mistralrs",
    "dep:either",
    "dep:candle",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
]
# CUDA build. Needs nvcc + CUDA toolkit >= 12.0 present at build time
# (Etappe 0 finding #3). Not enabled by default; opt in via
# `cargo build --features llm-cuda`.
llm-cuda = ["llm-cpu", "mistralrs/cuda"]
# Metal build (Apple GPU). Same relationship to `llm-cpu` as CUDA.
llm-metal = ["llm-cpu", "mistralrs/metal"]

# Voice control (spec 008): mic capture (cpal) + the STT pipeline scaffolding
# (audio module, interrupt matcher, voice Tauri commands). Independent of
# llm-cpu — see the llm-cpu comment above for what running without it means.
voice = ["dep:cpal"]

# End-to-end tests (spec 024, T078): builds `e2e_nostr_relay`, an in-process
# `MockRelay` as a process the two application processes of a scenario share.
# Not part of any default build.
e2e = ["nostr-sdk/local-relay"]
# Spec 044 (T007, research R4): a self-checking probe for the CI on Windows, macOS and Android. It
# does nothing unless `HOLZI_PROBE=1` (desktop) or `debug.holzi.probe=1` (Android) asks for it, and
# release bundles never enable it.
platform-probe = []

[dependencies]
tauri = { version = "2.12.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
# Reads and writes the one file the user picks in the dialog above (spec 035: export and import of
# the appearance); only three permissions, no scope of its own (capabilities/default.json).
tauri-plugin-fs = "2"
tauri-plugin-opener = "2.5.4"
# Spec 043 (ADR-0010): everything only Android has; a no-op on every other platform.
tauri-plugin-holzi-android = { path = "plugins/holzi-android" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2"
log = "0.4"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
ts-rs = { version = "12", features = ["serde-compat", "uuid-impl"] }
filetime = "0.2"
httpdate = "1"
# File-integrity hashing (models.file_sha256, spec 005 Entscheidung 6).
# Already present as a transitive dependency (rustls/haex-crdt); pinned
# directly here because the model-integrity boundary calls it explicitly.
sha2 = "0.11"
# Base64-encodes image/document attachment bytes for Anthropic's Messages
# API content blocks (spec 011-composer-toolbar-parity). Already present as
# a transitive dependency; pinned directly here for the same reason as
# sha2 above.
base64 = "0.23"
unicode-segmentation = "1.13"
# Erases the vault passphrase from memory when it is dropped (spec 013, FR-014).
# Already in the lock as a transitive dependency; the `serde` feature lets the
# argument types deserialize straight into the erasing wrapper.
zeroize = { version = "1", features = ["serde"] }

# Own-device sync (spec 024, research R1). `nostr` carries the secp256k1 keys,
# BIP-340 signatures and NIP-44 envelopes; `secp256k1` is the same version
# `nostr` uses and verifies Schnorr signatures over holzi's own payloads.
# `iroh` owns the device's QUIC endpoint key. `hkdf` derives the vault identity
# from the placeholder (R3) and the per-purpose keys, `chacha20poly1305`
# seals device names in the device list, `postcard` encodes everything that
# is signed (R10). `nostr-sdk` (research R7) is the relay client for presence
# (T037) and the link rendezvous (US5); its `local-relay` dev-dependency
# feature gives tests an in-process relay (`nostr_sdk::local_relay::MockRelay`)
# instead of a real server.
nostr = { version = "0.45", features = ["nip44", "nip59", "os-rng"] }
nostr-sdk = "0.45"
# The relay client's websocket (tungstenite over rustls) takes the process-wide
# default crypto provider, and with both `ring` (iroh) and `aws-lc-rs`
# (reqwest) in the tree rustls cannot pick one itself: the first `wss://`
# connect panics. `sync::presence` installs `ring` explicitly.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
secp256k1 = "0.33"
iroh = { version = "1.2", default-features = false, features = ["tls-ring"] }
hkdf = "0.13"
# Link code proofs (spec 024, R11): HMAC-SHA256 over the link transcript, and the
# QR code the main device shows.
hmac = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
postcard = { version = "1", features = ["use-std"] }
# Randomness for content keys and nonces. Already in the lock via other crates.
getrandom = "0.4"
# Encrypted folders (spec 048, T005): Base32 object names (RFC 4648, no padding), hex and Base64 of
# the format `HXEF`. Already in the lock via other crates; no new crate in the build.
data-encoding = { version = "2.11", features = ["std"] }

# Password manager (spec 034, plan "Neue Abhängigkeiten"). `keepass` reads KDBX 3 and 4 for the
# import (research R12, verdict of the spike T003); `csv` parses the Bitwarden and LastPass exports
# (RFC 4180, line breaks inside quotes); `sha1` is the SHA-1 of TOTP (R8, with `hmac` and `sha2`);
# `p256`, `ed25519-dalek`, `pkcs1` and `spki` derive the public passkey key from the private one of
# an import for ES256, EdDSA and RS256 (R12); `unicode-normalization` folds tag names (NFC, R2);
# the clipboard plugin is used from Rust only, so that copying and the timed clearing never put a
# secret into the webview (R9).
keepass = "0.15"
csv = "1.4"
sha1 = "0.11"
p256 = { version = "0.14", features = ["pkcs8", "pem"] }
ed25519-dalek = { version = "3", features = ["pkcs8"] }
pkcs1 = "0.8.0-rc.4"
pkcs8 = "0.11"
spki = "0.8"
unicode-normalization = "0.1"
tauri-plugin-clipboard-manager = "2"
# Passkey service (spec 036, research R8, R9): CBOR for COSE keys and the attestation object, the
# public suffix list for the relying party check, URL parsing for the origin.
ciborium = "0.2.2"
psl = "2.1.239"
url = "2.5.8"
percent-encoding = "2.3"
# External Bridge for haex-pass-browser (spec 049, research R1, R3): the WebSocket server with access
# to the upgrade request (Origin check), X25519 and AES-256-GCM as the unchanged client speaks them.
# All three are already in the lock (via nostr-sdk, ed25519-dalek and other crates); no new crate.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
curve25519-dalek = "5"
# The constant-time comparison of the key proof (spec 049, FR-048); in the lock via aes-gcm.
subtle = "2.6"

# haex-crdt 0.4.0, originally pinned per plans/001-desktop-mvp.md at commit
# 1c069ef; no tagged releases past v0.1.0 exist yet, so holzi pins main by
# full SHA. Bumped (spec 013, T084) for an erasing `SqlCipherKey`
# (haexmas/haex-crdt#30), and again (spec 024, T001) for the transactional
# write path `Database::write` / `Database::read` (#34), typed errors (#35)
# and the removal of the `DbConnection` layer (#36), then for typed BLOB sync
# (#37) and the stamping of rows written before the HLC (#38), then for the observer of
# committed changes (#39, `vault_events`), then (spec 017, T005–T007) for
# guarded SQL of extensions, schema mode and DDL triggers (#40), and for the limit of one
# value or row that a guard can lower (#41). `raw-connection` stays
# for the few statements that cannot run in a CRDT transaction (PRAGMA,
# VACUUM in `storage::maintenance`); `clippy.toml` bans it everywhere else.
haex-crdt = { git = "https://github.com/haexmas/haex-crdt", rev = "928d06af1ef61c507395a38fc3012ad03d15fc33", features = ["raw-connection"] }

# The bundle format of extensions (spec 017, research R3): its one implementation, shared with
# the `haex` tool of the vault-sdk (which uses its WebAssembly build). Pinned to the commit of
# haex-space/vault-sdk#54 on the haexmas fork until that PR is merged, then to the merge SHA.
haex-bundle = { git = "https://github.com/haex-space/vault-sdk", rev = "280cebf63eba72422d1ddd62e1edeb5ad7e7d3cc" }
# Versions of bundles, compared as the format parses them (effective bundle = highest, R11).
semver = "1"

# Local inference runtime chosen in plans/001-desktop-mvp.md §"Lokale Inferenz".
# Pinned to 0.8.1 per Etappe 0 finding #1 (0.6 line does not exist on
# crates.io; API moved between 0.6 expectation and 0.8.1). Kept optional so
# `--no-default-features` builds skip the candle/nvcc dependency graph.
mistralrs = { version = "0.8.1", optional = true }
# `Model::tokenize` takes an `Either` (the chat-template probe, spec 032 R8); the version mistralrs
# already resolves to.
either = { version = "1", optional = true }
# Tokio is unconditional: reqwest and the download commands need an async
# runtime even without local inference, and Tauri already pulls tokio in
# transitively. The extra `sync` and `fs` features are cheap. `net` is for
# the cli_delegate approval-bridge IPC hop (Unix domain socket / Windows
# named pipe, spec 007-cli-delegate data-model.md) — no separate crate.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "fs", "net", "io-std", "io-util"] }
futures = "0.3"
# `CancellationToken` for cooperative cancellation of an in-flight tool
# execution or a pending approval wait (spec.md FR-009/FR-010) — already a
# real (non-transitive) dependency of `rmcp`, see its `service.rs`.
tokio-util = { version = "0.7", features = ["rt", "io"] }

# Slice b: hardware detection and model catalog / download.
# `sysinfo` and `reqwest` are unconditional — hardware info and provider
# list are surfaced even in `--no-default-features` builds.
sysinfo = "0.39"
# Canonical paths without the `\\?\` prefix on Windows, comparable with the mount points of
# `sysinfo::Disks` (the free space before a model download, spec 043 FR-028).
dunce = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "query"] }

# S3 of holzi's storage connections (spec 038, research R1). Sans-IO: it only
# signs requests (SigV4 over RustCrypto `hmac`/`sha2`) and parses answers, the
# transfer goes through the `reqwest` above. Default features `rustcrypto` and
# `full`; never `aws-lc-rs`.
rusty-s3 = "0.10"

# `async-trait` lets provider adapters expose `async fn` in a `dyn`-safe
# trait. The chat dispatch needs `Arc<dyn ProviderAdapter>` to swap
# between local and api_key adapters at runtime; a native `async fn` in
# trait would not satisfy dyn-compatibility.
async-trait = "0.1"

# SSE frame reassembly for adapters that stream tokens over
# `text/event-stream` (Anthropic Messages API and every other api_key
# vendor). Wraps `reqwest::Response::bytes_stream()`.
eventsource-stream = "0.2"

# Official Rust MCP SDK (research.md §3), pinned per Constitution
# Principle IV. `client` + `transport-child-process` are the only
# features holzi needs — it is an MCP *client* spawning stdio servers,
# never a server itself. `cli_delegate`'s Claude Code permission-prompt-tool
# bridge (`adapters/cli_delegate/permission_mcp_server.rs`) speaks a
# minimal hand-rolled stdio JSON-RPC loop instead of depending on rmcp's
# `server`/`transport-io` features for one tool — considered and
# rejected as unnecessary weight for that single-tool surface.
rmcp = { version = "=3.5.0", default-features = false, features = ["client", "transport-child-process"] }

# Per-invocation disposable CLAUDE_CONFIG_DIR/CODEX_HOME + cwd (spec
# 007-cli-delegate FR-003) — was dev-dependency-only (tests used it for
# fixtures); cli_delegate's production code needs it too.
tempfile = "3"
# Spec 044 (research R6, R7): the file browser's search walk (`same_file_system`, no links), its
# typo-tolerant name matching and its
# thumbnails (only the decoders it needs, SIMD downscaling).
walkdir = "2.5"
frizbee = "0.13"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
fast_image_resize = { version = "6.1", features = ["image"] }
# Spec 044 US6 (research R8): text for agents from PDFs (pdf-extract on lopdf), spreadsheets
# (calamine) and documents (docx and odt read with zip and quick-xml, the versions calamine uses).
# quick-xml also reads the answers of WebDAV servers (spec 050 research R2).
pdf-extract = "0.12"
# The PDF model pdf-extract reads, to spell out the text operators `'` and `"` it does not know.
lopdf = "0.42"
calamine = "0.36"
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
# Spec 050 (research R3): SFTP storages. russh is the maintained pure-Rust SSH client; the ring
# backend adds no native library (ring already builds for every target through rustls). Keys come
# through its re-export `russh::keys`. russh 0.64 was younger than two weeks when it was chosen.
russh = { version = "0.63.3", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0.0"

# `claude setup-token` is a raw-ANSI Ink TUI, not a line-oriented CLI — piped,
# non-PTY stdio produces zero output (research.md §5, live-verified). Only
# cli_delegate's connect flow (US2) needs a real PTY; the chat-invocation path
# (claude -p) uses plain piped stdio as before. Cross-platform (wezterm's
# crate — Unix PTYs + Windows ConPTY).
portable-pty = "0.9"
# portable-pty's own error type (`spawn_command`/`openpty`/...) — already a
# transitive dependency, added directly so connect_claude.rs can downcast a
# spawn failure to the underlying `std::io::Error` (ENOENT detection,
# mirroring `process.rs::map_spawn_error`'s plain-`tokio::process` version).
anyhow = "1"

# Cross-platform microphone capture for voice control (spec 008), gated by
# the `voice` feature. Pure Rust, no separate cross-compile path for mobile.
cpal = { version = "0.18.2", optional = true }
# Local Whisper STT (spec 008), gated by `llm-cpu` (see its feature comment
# above) — `candle`/`candle-nn` pinned to 0.10.2 to match the version
# mistralrs 0.8.1 already resolves to, so only one candle version tree
# exists. `candle-core` is renamed to `candle` (matching candle's own
# examples) since that is the crate's own `use candle::...` import path.
# candle 0.11.0 exists upstream but mistralrs 0.8.1 (still latest) requires
# candle-core/candle-nn `^0.10.2`; bumping here alone would compile two
# candle version trees instead of one. Revisit once mistralrs releases
# against candle 0.11.
candle = { version = "0.10.2", package = "candle-core", optional = true }
candle-nn = { version = "0.10.2", optional = true }
candle-transformers = { version = "0.10.2", optional = true }
# Whisper's tokenizer (tokenizer.json, GPT-2-style BPE). `fancy-regex` matches
# the pure-Rust regex engine candle's own whisper example uses instead of the
# C-backed `onig` feature.
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"], optional = true }
tauri-plugin-notification = "2.5.1"
# Spec 017 US11 (research R21): mail of extensions. IMAP over tokio, its protocol types (async-imap
# returns them without re-exporting), parsing of fetched messages, and SMTP with lettre. TLS is
# rustls with ring and the system's certificate check, as everywhere in holzi (no aws-lc-rs, no
# native-tls).
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
imap-proto = "0.16"
mail-parser = "0.11"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-platform-verifier = "0.7"
lettre = { version = "0.11.23", default-features = false, features = ["tokio1-rustls", "ring", "rustls-platform-verifier", "smtp-transport", "builder"] }
ignore = { version = "0.4", default-features = false }
# Spec 060 R9: `haex-vault://contact/…` links. `Cargo.lock` pins `rust-ini` 0.21.1: 0.21.3 breaks this plugin
# (E0063), so a plain `cargo update` must not touch it.
tauri-plugin-deep-link = "2.4.9"

[target.'cfg(unix)'.dependencies]
# Kills a whole process group (`kill(-pgid, SIGKILL)`) so a killed
# `sh -c "..."` cannot leave behind a grandchild it forked — `Child::kill`
# only ever signals the one PID it holds (chat/tools/cli.rs, T032).
libc = "0.2"

# Spec 017, US9 (research R19): extensions watch folders on desktops only; Android and iOS answer
# "not available" (FR-066), so the watcher is not built there.
# Spec 043 (research R2): rustls-platform-verifier needs the VM and the application context on
# Android; tao publishes both through ndk-context.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk-context = "0.1"

# Spec 051 (research R13): Visitenkarten are scanned as QR codes on phones; the official plugin asks
# for the camera itself. Desktops paste the link instead.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.5.3"

# Spec 044 (research R11): the file browser watches its open folder on Android too (inotify);
# extensions keep answering "not available" there (spec 017).
[target.'cfg(not(target_os = "ios"))'.dependencies]
notify = "8"
notify-debouncer-full = "0.5"

# Spec 044 (FR-023): deleting on desktops moves to the system's trash; the crate builds for neither
# Android nor iOS, where holzi deletes for good after asking.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
trash = "5.2"

[dev-dependencies]
# Mock runtime for IPC-level tests of the vault gateway (spec 013).
tauri = { version = "2.12.0", features = ["test"] }
# Additive to the `[dependencies]` nostr-sdk entry: an in-process relay for
# presence/link tests (spec 024), no real server needed.
nostr-sdk = { version = "0.45", features = ["local-relay"] }
# `tempfile` moved to `[dependencies]` above — tests already get it
# transitively, no separate dev-dependency entry needed.
# Additive to the `[dependencies]` rmcp entry: test-only `server` support
# (feature-unified into one build across dependencies + dev-dependencies)
# lets `chat/tools/mcp_tests.rs` run a real, minimal `ServerHandler` over
# an in-memory `tokio::io::duplex` pair — no child process needed to
# exercise the real client-side tools/list + tools/call round trip.
# `cli_delegate`'s own MCP server (permission_mcp_server.rs) does not use
# this — it's a minimal hand-rolled stdio loop, not an rmcp `ServerHandler`
# (Cargo.toml `[dependencies]` comment above).
rmcp = { version = "=3.5.0", default-features = false, features = ["server"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util"] }
futures = "0.3"
# HTTP mock server for adapter tests — spins a local listener on a
# random port, allows scripted responses, and shuts down on Drop.
wiremock = "0.6"
# Spec 050 (research R14): a WebDAV server in the test process with its files in memory, for the
# stateful tests of the WebDAV store; served over `hyper` (already in the tree through reqwest).
dav-server = { version = "0.11", default-features = false, features = ["memfs"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# Spec 034 (spike T003, fixtures T079): writing a KDBX 4 file and generating an RSA key exist only
# in tests, the shipped build reads KDBX and never writes it or generates keys.
keepass = { version = "0.15", features = ["save_kdbx4"] }
rsa = { version = "0.10.0-rc.18", features = ["getrandom"] }

# Local Whisper (spec 008) runs candle's CPU kernels in-process. At the default
# dev `opt-level = 0` those kernels are unusably slow — measured 137 s to
# transcribe an 11 s clip with whisper-small in `tauri dev` — so the numeric
# crates on the inference hot path are built optimized even in dev builds. Only
# these are listed (not `"*"`) to keep the dev-build cost of everything else
# (tauri, wry, mistralrs' non-numeric crates, ...) unchanged. `gemm*` appears
# in two versions in Cargo.lock; a bare name applies to all of them.
[profile.dev.package.candle-core]
opt-level = 3
[profile.dev.package.candle-nn]
opt-level = 3
[profile.dev.package.candle-transformers]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.gemm-f16]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3
[profile.dev.package.gemm-f64]
opt-level = 3
[profile.dev.package.gemm-c32]
opt-level = 3
[profile.dev.package.gemm-c64]
opt-level = 3
[profile.dev.package.half]
opt-level = 3
[profile.dev.package.rayon]
opt-level = 3
[profile.dev.package.rayon-core]
opt-level = 3

# Spec 017 (T014, research R12/R25): wry injects Tauri's main-frame-only initialization scripts —
# with the IPC invoke key — into every frame on Windows and Android, so an extension's sandboxed
# iframe would get holzi's commands. haexmas/wry @ 47037dd (branch fix/main-frame-only-scripts,
# on tag wry-v0.57.0) guards them with `if (window === window.top)` and keeps them out of subframe
# HTML on Android. Remove this patch once a wry release contains the fix (upstream PR to
# tauri-apps/wry from branch fix/main-frame-only-scripts-dev, 226fd46).
# Spec 017 US8 (T099, research R20): tauri-plugin-notification reports clicks on notifications only
# on mobile. tauri-apps/plugins-workspace @ 4638151 (merge of their #3671 into branch v2, after
# notification-v2.5.1) reports them on desktop too and adds `Notification::on_action` for every
# platform, so holzi has one way to show notifications and hear clicks. Remove once a
# tauri-plugin-notification release after 2.5.1 contains it.
[patch.crates-io]
wry = { git = "https://github.com/haexmas/wry", rev = "47037ddc888b1576d0a558aa2a6d68346ce00735" }
tauri-plugin-notification = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "46381516b7bd7b6915ded698d93e92760b4221d7" }
# Spec 043 (research R2): lettre 0.11.23 calls `Verifier::new_with_extra_roots`, which
# rustls-platform-verifier does not offer on Android, so lettre does not compile there.
# haexmas/lettre @ 993d98c (branch fix/android-platform-verifier, on tag v0.11.23) uses
# `Verifier::new` without extra roots, like reqwest. Upstream: lettre/lettre#1167; drop this
# entry once a release contains it.
lettre = { git = "https://github.com/haexmas/lettre", rev = "993d98c5330ce5a3238e2f7fc37e9c9cf4a3f1c1" }
