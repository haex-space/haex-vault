# Allow-list of cargo advisories explicitly reviewed and accepted.
# Each entry MUST cite the GHSA / RUSTSEC ID and the reason.
[advisories]
ignore = [
  # iroh 0.98.x pulls hickory-dns 0.26.0-beta.4 transitively via iroh-relay and
  # hickory-resolver. Both advisories are fixed in hickory >= 0.26.1, but the
  # iroh stack has not yet released a version pinning the bumped floor.
  # Lift once an iroh release ships with hickory >= 0.26.1
  # (verify via `cargo update -p hickory-resolver`).
  "RUSTSEC-2026-0119", # hickory-proto: O(n^2) name-compression DoS during message encoding
  "RUSTSEC-2026-0120", # hickory-net: NSEC3 closest-encloser proof validation enters unbounded loop

  # libcrux-chacha20poly1305 0.0.7 is fixed in 0.0.8, but libcrux-aead 0.0.7
  # still pins 0.0.7 of the chacha crate. Lift when libcrux-aead releases the
  # bumped point version.
  "RUSTSEC-2026-0124", # libcrux-chacha20poly1305: potential panic on overlong ciphertext buffer

  # quick-xml 0.38.4 is pulled transitively by rust-s3 (^0.38), aws-creds (^0.38)
  # and plist (0.39 in 1.9.0, still <0.41). Both advisories are DoS-only and fixed
  # in quick-xml >=0.41.0. We do not feed attacker-controlled XML into these
  # paths (rust-s3/aws-creds only parse S3 responses from our trusted sync
  # backends; plist only reads our own bundle metadata). Lift once rust-s3 and
  # plist ship releases pinning quick-xml >=0.41
  # (verify via `cargo tree -i quick-xml`).
  "RUSTSEC-2026-0194", # quick-xml: unbounded namespace-declaration allocation in NsReader (DoS)
  "RUSTSEC-2026-0195", # quick-xml: quadratic runtime on duplicate attribute names in start tags (DoS)

  # openmls_rust_crypto 0.5.1 pulls hpke-rs 0.6.1, which pins hpke-rs-libcrux
  # =0.6.1. That in turn pins libcrux-aead =0.0.7 (-> libcrux-aesgcm 0.0.7) and
  # libcrux-sha3 =0.0.8 (-> libcrux-secrets 0.0.5 via libcrux-traits). Fixes
  # for all five ship in hpke-rs 0.7.0 (released 2026-07-15), but
  # openmls_rust_crypto still requires hpke-rs ^0.6.0 and has not bumped yet.
  # Lift once openmls_rust_crypto releases a version pinning hpke-rs >=0.7
  # (verify via `cargo tree -i libcrux-secrets`).
  "RUSTSEC-2026-0209", # libcrux-aesgcm: AES-GCM did not enforce limits on AAD length
  "RUSTSEC-2026-0211", # libcrux-aesgcm: non-constant-time auth tag check in AES-GCM decryption
  "RUSTSEC-2026-0212", # libcrux-secrets: incorrect output of constant-time swap/select on Aarch64
  "RUSTSEC-2026-0208", # libcrux-sha3: potential panic in AVX2 SHAKE-256
  "RUSTSEC-2026-0207", # libcrux-sha3: incorrect output of incremental portable SHAKE API on multiple squeeze calls
]
