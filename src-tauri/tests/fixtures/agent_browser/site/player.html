<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Player</title>
  </head>
  <body>
    <main>
      <h1>Player</h1>
      <audio id="a" aria-label="Ton" controls></audio>
      <p id="state">bereit</p>
    </main>
    <script>
      // Two seconds of silence as a WAV (8 kHz, 8 bit, mono), made here so no binary file is kept.
      const rate = 8000
      const samples = rate * 2
      const bytes = new Uint8Array(44 + samples).fill(128)
      const view = new DataView(bytes.buffer)
      const text = (at, value) =>
        [...value].forEach((c, i) => (bytes[at + i] = c.charCodeAt(0)))
      text(0, 'RIFF')
      view.setUint32(4, 36 + samples, true)
      text(8, 'WAVEfmt ')
      view.setUint32(16, 16, true)
      view.setUint16(20, 1, true)
      view.setUint16(22, 1, true)
      view.setUint32(24, rate, true)
      view.setUint32(28, rate, true)
      view.setUint16(32, 1, true)
      view.setUint16(34, 8, true)
      text(36, 'data')
      view.setUint32(40, samples, true)
      const audio = document.getElementById('a')
      audio.addEventListener('loadedmetadata', () => {
        document.getElementById('state').textContent = 'geladen'
      })
      audio.src = URL.createObjectURL(new Blob([bytes], { type: 'audio/wav' }))
    </script>
  </body>
</html>
