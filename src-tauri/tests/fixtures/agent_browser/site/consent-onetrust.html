<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Mit Banner</title>
  </head>
  <body>
    <main>
      <h1>Mit Banner</h1>
      <p>Der Artikel beginnt hier.</p>
      <p id="choice">offen</p>
    </main>
    <div id="onetrust-banner-sdk" role="dialog">
      <p>Wir verwenden Cookies, um die Seite zu verbessern.</p>
      <button id="onetrust-accept-btn-handler">Alle akzeptieren</button>
      <button id="onetrust-reject-all-handler">Alle ablehnen</button>
    </div>
    <script>
      const say = (text) =>
        (document.getElementById('choice').textContent = text)
      const banner = document.getElementById('onetrust-banner-sdk')
      document.getElementById('onetrust-accept-btn-handler').onclick = () => {
        say('akzeptiert')
        banner.remove()
      }
      document.getElementById('onetrust-reject-all-handler').onclick = () => {
        say('abgelehnt')
        banner.remove()
        // Platforms log the choice with a request of their own.
        fetch('/api/consent', {
          method: 'POST',
          body: JSON.stringify({ choice: 'reject' }),
        })
      }
    </script>
  </body>
</html>
