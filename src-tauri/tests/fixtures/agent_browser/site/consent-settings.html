<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Nur Einstellungen</title>
  </head>
  <body>
    <main>
      <h1>Nur Einstellungen</h1>
      <p>Der Artikel beginnt hier.</p>
      <p id="choice">offen</p>
    </main>
    <div id="cookie-banner" role="dialog">
      <p>Diese Seite nutzt Cookies.</p>
      <button id="yes">Akzeptieren</button>
      <button id="settings">Einstellungen</button>
      <div id="panel" hidden>
        <label
          ><input id="needed" type="checkbox" checked disabled /> Notwendige
          Cookies</label
        >
        <label><input id="ads" type="checkbox" checked /> Werbung</label>
        <label><input id="stats" type="checkbox" checked /> Statistik</label>
        <button id="save">Auswahl speichern</button>
      </div>
    </div>
    <script>
      const say = (text) =>
        (document.getElementById('choice').textContent = text)
      document.getElementById('yes').onclick = () => say('akzeptiert')
      document.getElementById('save').onclick = () => {
        const on = ['ads', 'stats'].filter(
          (id) => document.getElementById(id).checked,
        )
        say(`gespeichert, an: ${on.join(', ') || 'nichts'}`)
        document.getElementById('cookie-banner').hidden = true
      }
      document.getElementById('settings').onclick = () => {
        document.getElementById('panel').hidden = false
      }
    </script>
  </body>
</html>
