<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Viele Schaltflächen</title>
    <style>
      body {
        margin: 0;
      }
      button {
        display: block;
        height: 5px;
        width: 40px;
        margin: 0;
        padding: 0;
        font-size: 3px;
        border: 0;
        background: #ddd;
      }
    </style>
  </head>
  <body>
    <script>
      for (let i = 1; i <= 100; i++) {
        const button = document.createElement('button')
        button.type = 'button'
        button.textContent = `K${i}`
        document.body.append(button)
      }
    </script>
  </body>
</html>
