<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Zwecke einzeln</title>
  </head>
  <body>
    <main>
      <h1>Zwecke einzeln</h1>
      <p>Der Artikel beginnt hier.</p>
      <p id="choice">offen</p>
    </main>
    <div id="sp_message_container" role="dialog">
      <div id="first">
        <p>Wir nutzen Cookies und ähnliche Technologien. Datenschutz</p>
        <button id="all">Einwilligen und weiter</button>
        <button id="subscribe">Jetzt abonnieren</button>
        <button id="settings">Einstellungen</button>
      </div>
      <div id="panel" hidden>
        <h2>Privacy Einstellungen</h2>
        <p>
          Welche Daten wir und unsere Partner verarbeiten: Cookies und
          Zustimmung.
        </p>
        <div class="row" id="row-ads">
          <h3>Personalisierte Werbung</h3>
          <div class="pair">
            <button class="yes">Zustimmen</button>
            <button class="no">Ablehnen</button>
          </div>
        </div>
        <div class="row" id="row-social">
          <h3>Soziale Netzwerke</h3>
          <div class="pair">
            <button class="yes">Zustimmen</button>
            <button class="no">Ablehnen</button>
          </div>
        </div>
        <div class="row" id="row-reco">
          <h3>Inhaltsempfehlungen</h3>
          <div class="pair">
            <button class="yes">Zustimmen</button>
            <button class="no">Ablehnen</button>
          </div>
        </div>
        <button id="apply">Ausgewähltem zustimmen</button>
        <button id="accept-all">Allen zustimmen</button>
      </div>
    </div>
    <script>
      const say = (text) =>
        (document.getElementById('choice').textContent = text)
      const rows = [...document.querySelectorAll('.row')]
      document.getElementById('all').onclick = () => say('akzeptiert')
      document.getElementById('accept-all').onclick = () => say('akzeptiert')
      document.getElementById('subscribe').onclick = () => say('abonniert')
      document.getElementById('settings').onclick = () => {
        document.getElementById('first').hidden = true
        document.getElementById('panel').hidden = false
      }
      for (const row of rows) {
        row.querySelector('.yes').onclick = () => {
          row.dataset.choice = 'ja'
          const open = rows.every((r) => r.dataset.choice)
          document.getElementById('apply').disabled = !open && false
        }
        const no = row.querySelector('.no')
        if (no) no.onclick = () => (row.dataset.choice = 'nein')
      }
      document.getElementById('apply').onclick = () => {
        const said = rows.map(
          (r) => `${r.id.slice(4)}=${r.dataset.choice || '-'}`,
        )
        say(`gespeichert: ${said.join(' ')}`)
        document.getElementById('sp_message_container').hidden = true
      }
    </script>
  </body>
</html>
