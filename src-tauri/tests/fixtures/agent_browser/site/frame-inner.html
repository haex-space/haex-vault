<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Im Rahmen</title>
  </head>
  <body>
    <label> <input type="checkbox" id="human" /> Ich bin ein Mensch </label>
    <input id="said" aria-label="Im Rahmen schreiben" />
    <button type="button" id="hovered" aria-label="Hover im Rahmen">
      Hover
    </button>
    <p id="state">bereit</p>
    <audio id="a" aria-label="Ton" controls></audio>
    <script>
      // Two seconds of silence as a WAV, made here so no binary file is kept (see player.html).
      const rate = 8000
      const samples = rate * 2
      const bytes = new Uint8Array(44 + samples).fill(128)
      const view = new DataView(bytes.buffer)
      const text = (at, value) =>
        [...value].forEach((c, i) => (bytes[at + i] = c.charCodeAt(0)))
      text(0, 'RIFF')
      view.setUint32(4, 36 + samples, true)
      text(8, 'WAVEfmt ')
      view.setUint32(16, 16, true)
      view.setUint16(20, 1, true)
      view.setUint16(22, 1, true)
      view.setUint32(24, rate, true)
      view.setUint32(28, rate, true)
      view.setUint16(32, 1, true)
      view.setUint16(34, 8, true)
      text(36, 'data')
      view.setUint32(40, samples, true)
      document.getElementById('a').src = URL.createObjectURL(
        new Blob([bytes], { type: 'audio/wav' }),
      )
      document.getElementById('hovered').addEventListener('mouseenter', () => {
        document.getElementById('state').textContent = 'gehovert'
      })
    </script>
  </body>
</html>
