<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Modell-Testerweiterung</title>
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <h1>Modell-Testerweiterung</h1>
    <p><label>Foto der Seite <input id="photo" type="file" accept="image/jpeg,image/png,image/webp" /></label></p>
    <p>
      <button data-mode="page">Seite lesen und korrigieren</button>
      <button data-mode="loop">Testmodus: Schleife</button>
      <button data-mode="empty">Testmodus: leer</button>
      <button data-mode="cjk">Testmodus: chinesisch</button>
    </p>
    <p>Status: <span id="status">–</span></p>
    <pre id="result"></pre>
  </body>
</html>
