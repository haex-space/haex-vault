name: Build

on:
  # Build runs on direct pushes to long-lived branches (develop, main) and
  # on every pull_request event. Feature/PR branches are NOT in the push
  # filter on purpose: when a developer pushes to a PR branch, only the
  # pull_request event runs CI. The earlier "push: ['**']" trigger fired
  # both push and pull_request for the same SHA, so concurrency had to
  # cancel one — and the cancelled run left a "CI Success" required-check
  # entry behind that branch protection counted as a failure even after
  # the surviving run succeeded. Dropping the push-on-feature-branches
  # trigger eliminates the duplicate at the source.
  push:
    branches:
      - develop
      - main
      # Bot-pushed sync branches (release-please.yml pushes with RELEASE_PAT
      # so this event fires; the matching pull_request event is suppressed
      # by GitHub's anti-recursion rule when the PR is opened with the
      # default token, so this is the only chance Build has to run there).
      - 'sync-main/**'
      # Bot-pushed back-sync branches (release-please.yml syncs version bumps
      # from main back to develop after each release).
      - 'sync-develop/**'
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      haex_e2e_tests_ref:
        description: 'haex-e2e-tests branch or SHA for test files (default: main)'
        default: ''
  # Expose as reusable workflow so release-please.yml can build a release
  # tag directly, sidestepping the anti-recursion rule that blocks
  # build.yml from triggering via bot-created PR/tag events.
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out and verify (e.g. a release tag vX.Y.Z)'
        required: false
        type: string
        default: ''

concurrency:
  # One run per logical work unit. Three cases:
  #   - workflow_call (from release-please.yml): unique per run_id so a
  #     release build never queues behind a push-Build for the same commit.
  #   - main branch: shared 'build-main' so a new push (sync after release)
  #     cancels the previous build (serial).
  #   - everywhere else: keyed by event_name + commit SHA. push (on
  #     develop/main/sync-*) and pull_request can still fire for the SAME
  #     SHA: a develop→main release PR (its head IS the develop tip that
  #     push:develop already built) and sync-develop/* PRs (built by both
  #     their push and their PR event). If those shared a group,
  #     cancel-in-progress would kill one run, leaving a stale failed
  #     "CI Success" that branch protection counts even after the survivor
  #     passes — which is exactly what blocked the v2.9.1 release PR.
  #     event_name in the key keeps push and PR runs separate so both
  #     complete. (Safe to read event_name here: the workflow_call case is
  #     already handled by the inputs.ref branch above.)
  #
  # workflow_call detection: use `inputs.ref != ''` rather than
  # `github.event_name == 'workflow_call'`. Inside a reusable workflow,
  # github.event (and event_name) reflect the CALLER's event — so the
  # event_name check would never match and the release build would share
  # a concurrency group with the parallel push-Build for the same SHA.
  group: ${{ inputs.ref != '' && format('build-call-{0}', github.run_id) || (github.ref == 'refs/heads/main' && 'build-main') || format('build-{0}-{1}', github.event_name, github.event.pull_request.head.sha || github.sha) }}
  cancel-in-progress: ${{ inputs.ref == '' }}

jobs:
  # Skip build only for version bump commits (they trigger the Release workflow via tag).
  # Dependabot PRs always run full CI now — branch protection requires CI Success before
  # merge, so skipping CI would silently pass the required check. Fail-secure > save-cpu.
  check-skip:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      should_skip: ${{ steps.check.outputs.should_skip }}
      is_dependabot: ${{ steps.dep-context.outputs.is_dependabot }}
      dep_update_type: ${{ steps.dep-meta.outputs.update-type }}
      skip_e2e: ${{ steps.dep-context.outputs.skip_e2e }}
      e2e_tests_ref: ${{ steps.e2e-ref.outputs.ref }}
    steps:
      - name: Check if version bump commit
        id: check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          REF_INPUT: ${{ inputs.ref }}
        run: |
          # workflow_call invocations from release-please.yml pass inputs.ref
          # (the release tag). Inside a reusable workflow `github.event` still
          # reflects the CALLER's event, so the chore(release) skip rule
          # below would otherwise trip on the develop push's commit message
          # and starve the release of artifacts. Exempt explicit ref builds.
          if [ -n "$REF_INPUT" ]; then
            echo "should_skip=false" >> "$GITHUB_OUTPUT"
            echo "Reusable invocation for ref=$REF_INPUT — build proceeds"
            exit 0
          fi
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -n 1)
          # Skip build for release-please's release-PR merge commit. The
          # release tag gets its own dedicated build via release-please.yml's
          # build-release job (workflow_call into build.yml), so this push
          # event would just rebuild the identical code. The "v<digit>"
          # pattern is intentional: it matches release-please's
          # "chore(release): vX.Y.Z" pull-request title and NOT other
          # release-themed chores (e.g. workflow tweaks). Old pattern kept
          # for compatibility with any in-flight pre-release-please commits.
          if [[ "$FIRST_LINE" =~ ^chore\(release\):\ v[0-9] ]] || [[ "$FIRST_LINE" == "Bump version to"* ]]; then
            echo "should_skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping build for release-PR merge commit"
          else
            echo "should_skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Detect Dependabot semver level so we can gate E2E tests:
      # patch/minor → skip E2E (pragmatic), major → run E2E (strict).
      #
      # Use `github.event.pull_request.user.login` rather than `github.actor`:
      # when Dependabot opens a PR via an org-level GitHub App or PAT, the
      # `actor` is the org account, not `dependabot[bot]`, and the metadata
      # step gets skipped — leaving every Dependabot PR in the strict E2E
      # gate. The PR author field always reflects who opened the PR.
      # `skip-commit-verification: true` is needed because maintainer rebases
      # invalidate Dependabot's commit signatures, after which the action
      # refuses to set `update-type` and fails the step ("PR is not from
      # Dependabot"). The PR-author guard above is the real safety check —
      # `pull_request.user.login` is set by GitHub at PR creation and cannot
      # be spoofed by editing branch contents.
      - name: Fetch Dependabot metadata
        if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event_name == 'pull_request'
        id: dep-meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          skip-commit-verification: true

      # Cross-repo branch coupling: when a haex-vault branch ships schema
      # or API changes that need matching e2e tests, the tests usually live on
      # a same-named branch in haex-e2e-tests. Without this resolution the
      # e2e shard runs against `main` and fails on the column/API mismatch.
      # Explicit `haex_e2e_tests_ref` workflow_dispatch input always wins;
      # otherwise we probe haex-e2e-tests for the haex-vault branch and fall
      # back to `main` if it doesn't exist.
      - name: Resolve haex-e2e-tests ref
        id: e2e-ref
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.haex_e2e_tests_ref }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -n "$INPUT_REF" ]; then
            echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
            echo "Using explicit haex_e2e_tests_ref=$INPUT_REF"
            exit 0
          fi
          if [ -z "$BRANCH" ] || [ "$BRANCH" = "main" ]; then
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "Default branch — using haex-e2e-tests=main"
            exit 0
          fi
          if gh api -X GET "repos/haex-space/haex-e2e-tests/branches/$BRANCH" --silent 2>/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "Found matching haex-e2e-tests branch: $BRANCH"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "No matching haex-e2e-tests branch for '$BRANCH' — using main"
          fi

      - name: Compute dependency context
        id: dep-context
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT: ${{ github.event_name }}
          UPDATE_TYPE: ${{ steps.dep-meta.outputs.update-type }}
        run: |
          if [ "$PR_AUTHOR" = "dependabot[bot]" ] && [ "$EVENT" = "pull_request" ]; then
            echo "is_dependabot=true" >> "$GITHUB_OUTPUT"
            # Skip E2E only when we have positive confirmation of patch/minor.
            # Empty/unknown update-type → default to running E2E (strict).
            case "$UPDATE_TYPE" in
              version-update:semver-patch|version-update:semver-minor)
                echo "skip_e2e=true" >> "$GITHUB_OUTPUT"
                echo "Dependabot $UPDATE_TYPE — pragmatic gate (E2E skipped)"
                ;;
              *)
                echo "skip_e2e=false" >> "$GITHUB_OUTPUT"
                echo "Dependabot update-type='$UPDATE_TYPE' — strict gate (E2E required)"
                ;;
            esac
          else
            echo "is_dependabot=false" >> "$GITHUB_OUTPUT"
            echo "skip_e2e=false" >> "$GITHUB_OUTPUT"
          fi

  # Run tests first before building
  test:
    needs: check-skip
    if: needs.check-skip.outputs.should_skip != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # When invoked as a reusable workflow from release-please.yml,
          # inputs.ref points at the release tag we want to build. For
          # push/PR runs inputs.ref is empty and checkout falls back to
          # the event's sha.
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Rust tests
        run: cd src-tauri && cargo test

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Run TypeScript tests
        run: pnpm test

  # Rust formatting gate — fast, independent of the build.
  fmt:
    needs: check-skip
    if: needs.check-skip.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cd src-tauri && cargo fmt --check

  # Desktop E2E tests (run after desktop build, independent of Android).
  # One matrix leg per built binary (linux/windows/macos) so all three run
  # in parallel rather than sequentially. Each leg calls the same reusable
  # workflow with its own artifact + haex_vault_platform; haex-e2e-tests
  # picks the right runner/automation path (tauri-driver, tauri-driver +
  # msedgedriver, or the in-process WebDriver plugin) from that input.
  e2e-tests:
    needs: [test, check-skip, build-desktop]
    if: needs.check-skip.outputs.should_skip != 'true' && needs.check-skip.outputs.skip_e2e != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            artifact: haex-vault-linux-e2e
          - platform: windows
            artifact: haex-vault-windows-e2e
          - platform: macos
            artifact: haex-vault-macos-e2e
    uses: haex-space/haex-e2e-tests/.github/workflows/e2e-tests.yml@main
    # Forwards this repo's secrets, notably TS_AUTHKEY (needed by the
    # windows/macos legs' Tailscale bridge — see haex-e2e-tests).
    secrets: inherit
    with:
      build_type: build
      # Clone the same ref we just built from so the Nuxt/TS bundle matches
      # the Rust binary. Without this the frontend falls back to 'main' and
      # ships a different contract than the backend, e.g. missing fields
      # that the Rust command layer now requires.
      haex_vault_version: ${{ inputs.ref || github.head_ref || github.ref_name }}
      haex_vault_artifact: ${{ matrix.artifact }}
      haex_vault_artifact_run_id: ${{ github.run_id }}
      haex_vault_platform: ${{ matrix.platform }}
      haextension_version: main
      vault_sdk_version: main
      sync_server_version: main
      # Auto-resolved by check-skip: matches the haex-vault branch in
      # haex-e2e-tests when present, falls back to `main`. Explicit
      # workflow_dispatch `haex_e2e_tests_ref` input takes precedence.
      e2e_tests_ref: ${{ needs.check-skip.outputs.e2e_tests_ref }}

  # Android E2E tests (run after Android build, independent of desktop E2E)
  e2e-tests-android:
    name: Android E2E Tests
    needs: [check-skip, build-android]
    if: needs.check-skip.outputs.should_skip != 'true' && needs.check-skip.outputs.skip_e2e != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout E2E tests
        uses: actions/checkout@v7
        with:
          repository: haex-space/haex-e2e-tests
          ref: ${{ needs.check-skip.outputs.e2e_tests_ref }}

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download Android APK artifact
        uses: actions/download-artifact@v8
        with:
          name: haex-vault-android-e2e
          path: ./apk

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android/sdk/ndk

      - name: Clone sync-server for docker-compose config
        run: |
          mkdir -p repos
          git clone --depth 1 https://x-access-token:${{ github.token }}@github.com/haex-space/haex-sync-server.git repos/haex-sync-server

      - name: Start backend services
        run: |
          docker compose -f docker/docker-compose.yml up -d sync-db sync-gotrue sync-kong sync-server
          echo "Waiting for backend services..."
          for i in {1..60}; do
            if curl -s http://localhost:3002/ > /dev/null 2>&1; then
              echo "Sync server ready after ~$((i*2))s"
              break
            fi
            sleep 2
          done

      - name: Create test script
        run: |
          cat > /tmp/run-android-e2e.sh << 'SCRIPT'
          #!/bin/bash
          set -e
          WS="$GITHUB_WORKSPACE"
          APK_FILE=$(find "$WS/apk" -name "*.apk" -type f | head -1)
          echo "Installing APK: $APK_FILE"
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK file found!"
            exit 1
          fi
          adb install "$APK_FILE"
          adb reverse tcp:3002 tcp:3002
          adb reverse tcp:8000 tcp:8000
          cd "$WS"
          ~/.maestro/bin/maestro test .maestro/android-smoke-test.yaml --format junit --output maestro-results.xml || true
          if [ -f .maestro/android-sync-test.yaml ]; then
            ~/.maestro/bin/maestro test .maestro/android-sync-test.yaml --format junit --output maestro-sync-results.xml || true
          fi
          SCRIPT
          chmod +x /tmp/run-android-e2e.sh

      - name: Run Android E2E Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: /tmp/run-android-e2e.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-e2e-results-${{ github.run_id }}
          path: |
            maestro-results.xml
            maestro-sync-results.xml
          retention-days: 30

  build-desktop:
    needs: [test, check-skip]
    if: needs.check-skip.outputs.should_skip != 'true'
    # Cap build time so a hung apt-get or CDN 504 doesn't silently burn
    # 6 hours of runner time (GitHub's default) and block the release
    # pipeline indefinitely. Observed normal runtime: Linux ~15-22 min,
    # macOS ~15-22 min normally but the aarch64 leg also does a second,
    # CSP-patched build for the e2e artifact (see "Build E2E binary with
    # Tailscale CSP (macOS)" below) which pushed one run to the full 30
    # min and got cancelled mid cache-save; a later run hit the 35-min
    # cap mid second-build for the same reason (PR #799), so the macOS
    # timeout is now bumped to 50 min to give the aarch64 leg the same
    # kind of two-build headroom Windows already has. Windows ~27 min on
    # a cold cache plus ~2 min for cache save — the extra headroom on
    # Windows/macOS prevents the cache-save step from being killed by
    # the timeout, which would leave the cache unpopulated and trap us
    # in a loop of cold-compile runs. Linux hit the same class of
    # problem once too, not from a slow build but a slow apt-get against
    # the Azure Ubuntu mirror (~15 min for a handful of dev packages)
    # eating most of the 30 min budget before the real build even
    # started — same fix, same headroom as macOS. Windows also does a
    # second, CSP-patched build for the e2e artifact (see "Build E2E
    # binary with Tailscale CSP (Windows)" below); on a cold cache the
    # two builds together hit the 45 min cap mid-compile and got
    # cancelled, so it needs the same kind of headroom macOS already has
    # for its aarch64 leg.
    timeout-minutes: ${{ matrix.platform == 'windows-latest' && 60 || (matrix.platform == 'macos-latest' && 50 || 35) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'ubuntu-22.04-arm'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.platform, 'ubuntu-22.04')
        run: |
          # ports.ubuntu.com is unreachable over HTTP from GitHub's Azure-hosted
          # ARM runners — Canonical's own infrastructure (IP 91.189.91.102) times
          # out, and every *.ports.ubuntu.com country mirror is a CNAME to that
          # same IP, so swapping mirrors doesn't help. HTTPS is served by
          # Cloudflare on a different IP range that's reachable from these
          # runners, so we rewrite the sources to https://.
          if [ "${{ matrix.platform }}" = "ubuntu-22.04-arm" ]; then
            sudo sed -i 's|http://ports.ubuntu.com|https://ports.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          fi
          # ForceIPv4 + apt's own retries are kept as defense in depth: if
          # Cloudflare's v6 route is also flaky from the runner, v4 still works,
          # and a single 504 won't fail the whole build.
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 >/dev/null
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80retries >/dev/null
          echo 'Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80timeout >/dev/null

          sudo apt-get update
          # xdg-utils provides xdg-mime which the AppImage bundler invokes.
          # Preinstalled on the amd64 runner image, missing on arm.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev xdg-utils

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Must run AFTER `Setup Rust cache`: rust-cache restores `~/.cargo/bin`
      # from the cached workspace, which on macOS overwrites these symlinks
      # with the broken rustup-init proxies again. Doing the repair last
      # makes it the authoritative state for the rest of the job.
      #
      # The macos-15-arm64 20260511+ runner images ship a pre-installed
      # `rustup-init` binary that is also installed under `~/.cargo/bin/cargo`
      # and `~/.cargo/bin/rustc`. When invoked under those names it still
      # behaves like the installer ("unexpected argument 'metadata' found"),
      # breaking any tool that resolves cargo via CARGO_HOME (tauri-action's
      # `cargo metadata` does exactly that, regardless of PATH).
      # Overwrite the broken proxies with direct symlinks to the toolchain's
      # real binaries — `rustup which` returns the actual paths.
      #
      # `rustup target add` is also called defensively: dtolnay/rust-toolchain
      # installs the targets in `~/.rustup` during Setup Rust, but observed
      # runs have shown the target installation occasionally not surviving
      # cache restore (probably runner-image variance — same cache key has
      # produced both success and "Target X does not exist" failures).
      # `rustup target add` is idempotent, so re-adding is a cheap insurance.
      - name: Repair cargo/rustc proxies and PATH
        shell: bash
        run: |
          real_cargo=$(rustup which cargo)
          real_rustc=$(rustup which rustc)
          toolchain_bin=$(dirname "$real_cargo")
          echo "Active toolchain bin: $toolchain_bin"
          mkdir -p "$HOME/.cargo/bin"
          ln -sf "$real_cargo" "$HOME/.cargo/bin/cargo"
          ln -sf "$real_rustc" "$HOME/.cargo/bin/rustc"
          echo "$toolchain_bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" --version
          "$HOME/.cargo/bin/cargo" metadata --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml >/dev/null && echo "cargo metadata OK"
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
            echo "Installed targets:"
            rustup target list --installed
          fi

      - name: Clean stale migration caches
        shell: bash
        run: find src-tauri/target -path "*/database/migrations" -type d -exec rm -rf {} + 2>/dev/null || true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Inject -dev.<sha> suffix for non-release builds. Tags are built
      # from release-please.yml via workflow_call and carry the canonical
      # release version, so skip injection there.
      - name: Inject dev version suffix
        if: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.ref == '' }}
        run: node scripts/inject-dev-version.js

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ contains(matrix.args, 'aarch64') && 'aarch64' || 'x86_64' }}
          path: |
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/macos/*.app

      # Build E2E binary with relaxed CSP for the Tailscale-reachable backend
      # stack (see haex-e2e-tests) and the in-process WebDriver plugin
      # enabled (tauri-driver has no WKWebView support on macOS). Native
      # (aarch64) leg only: GitHub's macos-latest runner is Apple Silicon, so
      # the cross-compiled x86_64 leg can't even execute what it produces.
      # TAILSCALE_TAILNET_DOMAIN must be configured as a repo/org Actions
      # variable (the MagicDNS suffix of the tailnet used by haex-e2e-tests).
      - name: Build E2E binary with Tailscale CSP (macOS)
        if: matrix.platform == 'macos-latest' && contains(matrix.args, 'aarch64')
        env:
          # Routed through env instead of interpolating ${{ vars.* }} directly
          # into the shell script: GHA expands template expressions before
          # the shell sees them, so a raw interpolation is a template-
          # injection risk if the variable ever contained shell metachars.
          TAILSCALE_TAILNET_DOMAIN: ${{ vars.TAILSCALE_TAILNET_DOMAIN }}
        run: |
          if [ -z "$TAILSCALE_TAILNET_DOMAIN" ]; then
            echo "::error::TAILSCALE_TAILNET_DOMAIN repo/org Actions variable is not set — required to build the macOS e2e binary's CSP"
            exit 1
          fi
          # --arg (not string interpolation) keeps the domain value as inert
          # JSON-encoded data, never part of the jq program text.
          jq --arg domain "$TAILSCALE_TAILNET_DOMAIN" \
            '.app.security.csp["connect-src"] += ["http://*." + $domain + ":8000", "http://*." + $domain + ":8001", "http://*." + $domain + ":3001", "ws://*." + $domain + ":8000", "wss://*." + $domain + ":8000"]' \
            src-tauri/tauri.conf.json > /tmp/tauri-e2e.conf.json && \
            mv /tmp/tauri-e2e.conf.json src-tauri/tauri.conf.json
          # `cargo tauri` isn't installed as a standalone subcommand in this
          # job (tauri-apps/tauri-action doesn't expose it on PATH) — use the
          # already-installed @tauri-apps/cli from node_modules instead. Run
          # from the repo root: tauri-cli auto-locates src-tauri/ from there,
          # same as the pnpm-driven "Build Tauri app" step above.
          pnpm tauri build --target aarch64-apple-darwin --features tauri/custom-protocol,e2e-webdriver-macos,e2e-hooks

      - name: Upload macOS binary for E2E tests
        if: matrix.platform == 'macos-latest' && contains(matrix.args, 'aarch64')
        uses: actions/upload-artifact@v7
        with:
          name: haex-vault-macos-e2e
          # database/ holds the migration resources tauri places next to the
          # bundled app — see the Linux e2e upload comment below for why.
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Haex Vault.app
            src-tauri/target/aarch64-apple-darwin/release/database
          retention-days: 1

      - name: Upload artifacts (Ubuntu)
        if: startsWith(matrix.platform, 'ubuntu-22.04')
        uses: actions/upload-artifact@v7
        with:
          # Split per-arch so release.yml can stage both amd64 + arm64
          # bundles independently. Wildcard `linux-*` collects everything.
          name: linux-${{ matrix.platform == 'ubuntu-22.04-arm' && 'arm64' || 'amd64' }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm

      # Build E2E binary with relaxed CSP for Docker internal hostnames.
      # Kept amd64-only: E2E infra (Docker compose, emulators) is amd64,
      # running it on arm would double cost for zero coverage gain.
      - name: Build E2E binary with Docker CSP
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          jq '.app.security.csp["connect-src"] += ["http://sync-kong:8000", "http://sync-server:3002", "http://marketplace:3001", "http://marketplace-kong:8000", "ws://sync-kong:8000", "ws://sync-server:3002", "wss://sync-kong:8000", "wss://sync-server:3002"]' \
            src-tauri/tauri.conf.json > /tmp/tauri-e2e.conf.json && \
            mv /tmp/tauri-e2e.conf.json src-tauri/tauri.conf.json
          # tauri/custom-protocol is what separates a production binary from
          # a dev one (tauri's build.rs: dev = !custom-protocol). Without it
          # the binary ignores the embedded frontend and tries to load the
          # devUrl (http://localhost:31303), which doesn't exist in the e2e
          # container. `cargo tauri build` enables it implicitly; plain
          # `cargo build` must pass it explicitly.
          #
          # e2e-hooks registers the test-only Tauri commands the shared-space
          # adversarial specs drive (test_seed_shared_space_delete_log_entry).
          # It belongs on every e2e artifact (Linux here, Windows + macOS in
          # the platform-specific e2e build steps below), while the bundles
          # uploaded above ship to users and must stay on `default = []`.
          # Without it the e2e image's prebuilt path silently yields a binary
          # lacking those commands — haex-e2e-tests' Dockerfile passes the
          # feature on its build-from-source fallback, which the prebuilt
          # path skips entirely.
          cd src-tauri && cargo build --release --features tauri/custom-protocol,e2e-hooks

      - name: Upload Linux binary for E2E tests
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v7
        with:
          name: haex-vault-linux-e2e
          # database/ holds the migration resources tauri places next to
          # the binary — the e2e image needs them or the vault fails to
          # run migrations on startup. Both paths share target/release as
          # root, so the artifact contains haex-vault + database/.
          path: |
            src-tauri/target/release/haex-vault
            src-tauri/target/release/database
          retention-days: 1

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      # Build E2E binary with relaxed CSP for the Tailscale-reachable backend
      # stack (see haex-e2e-tests). tauri-driver's Windows support (Microsoft
      # Edge WebDriver against WebView2) is official, so no extra plugin
      # feature is needed here — only the CSP + custom-protocol rebuild, same
      # as the Linux e2e path. TAILSCALE_TAILNET_DOMAIN must be configured as
      # a repo/org Actions variable (see the macOS e2e step above).
      #
      # additionalBrowserArgs/dataDirectory: as of WebView2 Evergreen ~150,
      # a security hardening change makes WebView2 IGNORE the WEBVIEW2_*
      # environment variable / HKCU-policy mechanism it used to read
      # browser args from whenever the host process runs elevated — which
      # is exactly what GitHub's Windows runner user is. tauri-driver's
      # `tauri:options.webviewOptions.additionalBrowserArguments` capability
      # goes through that same (now-ignored) mechanism, so msedgedriver's
      # "New Session" call always failed with "session not created:
      # DevToolsActivePort file doesn't exist" — WebView2 never actually
      # opened a debug port for it to find. Baking `--remote-debugging-
      # port=0` into the COMPILED config instead is "trusted" input (an
      # app API call, not a user-writable env var/policy) and still works
      # under elevation. dataDirectory is fixed and must match the
      # `webviewOptions.userDataFolder` the E2E harness sends when creating
      # the session (see global-setup.ts) — that's where WebView2 writes
      # the DevToolsActivePort file msedgedriver polls for.
      - name: Build E2E binary with Tailscale CSP (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          # See the macOS e2e step's comment above for why this goes through
          # env instead of direct ${{ vars.* }} interpolation.
          TAILSCALE_TAILNET_DOMAIN: ${{ vars.TAILSCALE_TAILNET_DOMAIN }}
        run: |
          if [ -z "$TAILSCALE_TAILNET_DOMAIN" ]; then
            echo "::error::TAILSCALE_TAILNET_DOMAIN repo/org Actions variable is not set — required to build the Windows e2e binary's CSP"
            exit 1
          fi
          jq --arg domain "$TAILSCALE_TAILNET_DOMAIN" \
            '.app.security.csp["connect-src"] += ["http://*." + $domain + ":8000", "http://*." + $domain + ":8001", "http://*." + $domain + ":3001", "ws://*." + $domain + ":8000", "wss://*." + $domain + ":8000"]
             | .app.windows[0].additionalBrowserArgs = "--remote-debugging-port=0 --disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection"
             | .app.windows[0].dataDirectory = "C:\\haex-e2e-webview-data"' \
            src-tauri/tauri.conf.json > /tmp/tauri-e2e.conf.json && \
            mv /tmp/tauri-e2e.conf.json src-tauri/tauri.conf.json
          cd src-tauri && cargo build --release --features tauri/custom-protocol,e2e-hooks

      - name: Upload Windows binary for E2E tests
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: haex-vault-windows-e2e
          # database/ holds the migration resources tauri places next to the
          # binary — see the Linux e2e upload comment below for why.
          path: |
            src-tauri/target/release/haex-vault.exe
            src-tauri/target/release/database
          retention-days: 1

  build-android:
    needs: [test, check-skip]
    if: needs.check-skip.outputs.should_skip != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
        id: setup-ndk

      - name: Setup Android NDK environment for OpenSSL
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

          # Add all Android toolchains to PATH for OpenSSL cross-compilation
          echo "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

          # Set CC, AR, RANLIB for each target
          echo "CC_aarch64_linux_android=aarch64-linux-android24-clang" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=llvm-ar" >> $GITHUB_ENV
          echo "RANLIB_aarch64_linux_android=llvm-ranlib" >> $GITHUB_ENV

          echo "CC_armv7_linux_androideabi=armv7a-linux-androideabi24-clang" >> $GITHUB_ENV
          echo "AR_armv7_linux_androideabi=llvm-ar" >> $GITHUB_ENV
          echo "RANLIB_armv7_linux_androideabi=llvm-ranlib" >> $GITHUB_ENV

          echo "CC_i686_linux_android=i686-linux-android24-clang" >> $GITHUB_ENV
          echo "AR_i686_linux_android=llvm-ar" >> $GITHUB_ENV
          echo "RANLIB_i686_linux_android=llvm-ranlib" >> $GITHUB_ENV

          echo "CC_x86_64_linux_android=x86_64-linux-android24-clang" >> $GITHUB_ENV
          echo "AR_x86_64_linux_android=llvm-ar" >> $GITHUB_ENV
          echo "RANLIB_x86_64_linux_android=llvm-ranlib" >> $GITHUB_ENV

          # 16KB page alignment for native libraries (required by API 30+ emulators and Android 15+ devices)
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS=-C link-arg=-z -C link-arg=max-page-size=16384" >> $GITHUB_ENV
          echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_RUSTFLAGS=-C link-arg=-z -C link-arg=max-page-size=16384" >> $GITHUB_ENV
          echo "CARGO_TARGET_I686_LINUX_ANDROID_RUSTFLAGS=-C link-arg=-z -C link-arg=max-page-size=16384" >> $GITHUB_ENV
          echo "CARGO_TARGET_X86_64_LINUX_ANDROID_RUSTFLAGS=-C link-arg=-z -C link-arg=max-page-size=16384" >> $GITHUB_ENV

      - name: Install build dependencies for OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y perl make

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean stale migration caches
        run: |
          # Remove cached migration files from target/ to prevent stale schemas
          # after migration squash/regeneration. The Rust build will re-copy from
          # src-tauri/database/migrations/ (the source of truth).
          find src-tauri/target -path "*/database/migrations" -type d -exec rm -rf {} + 2>/dev/null || true

      # Inject -dev.<sha> suffix for non-release builds. release-please.yml
      # builds from tags via workflow_call and skips this step entirely.
      - name: Inject dev version suffix
        if: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.ref == '' }}
        run: node scripts/inject-dev-version.js

      - name: Initialize Android project
        run: |
          rm -rf src-tauri/gen/android
          pnpm tauri android init

      - name: Update Kotlin version for biometry plugin
        run: |
          sed -i 's/kotlin-gradle-plugin:1.9.25/kotlin-gradle-plugin:2.1.0/' src-tauri/gen/android/build.gradle.kts

      - name: Add camera permission to Android manifest
        run: |
          sed -i '/<uses-permission android:name="android.permission.INTERNET" \/>/a \    <uses-permission android:name="android.permission.CAMERA" \/>\n    <uses-feature android:name="android.hardware.camera" android:required="false" \/>\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" \/>' src-tauri/gen/android/app/src/main/AndroidManifest.xml

      - name: Copy custom MainActivity
        run: |
          cp .github/android-MainActivity.kt src-tauri/gen/android/app/src/main/java/space/haex/vault/MainActivity.kt

      - name: Generate app icons
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Setup Keystore and Signing Config
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE" ]; then
            # Decode keystore from base64 secret
            echo "$ANDROID_KEYSTORE" | base64 -d > /tmp/keystore.jks
            ls -la /tmp/keystore.jks

            # Create keystore.properties for Gradle signing config
            echo "storeFile=/tmp/keystore.jks" > src-tauri/gen/android/keystore.properties
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD" >> src-tauri/gen/android/keystore.properties
            echo "keyAlias=$ANDROID_KEY_ALIAS" >> src-tauri/gen/android/keystore.properties
            echo "keyPassword=$ANDROID_KEY_PASSWORD" >> src-tauri/gen/android/keystore.properties

            # Copy pre-configured build.gradle.kts with signing config
            cp .github/android-signing-build.gradle.kts src-tauri/gen/android/app/build.gradle.kts

            echo "KEYSTORE_CONFIGURED=true" >> $GITHUB_ENV
            echo "Keystore configured for signing"
          else
            echo "KEYSTORE_CONFIGURED=false" >> $GITHUB_ENV
            echo "No keystore configured, building unsigned APK"
          fi

      - name: Build Android APK and AAB
        run: |
          # Build universal APK (all architectures in one APK) - required for Play Store
          pnpm tauri android build --apk --aab

      - name: List generated APK files
        run: |
          echo "=== Generated APK files ==="
          find src-tauri/gen/android/app/build/outputs -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
          echo ""
          echo "=== Generated AAB files ==="
          find src-tauri/gen/android/app/build/outputs -name "*.aab" -type f 2>/dev/null || echo "No AAB files found"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab

      # Prepare APK for E2E tests. On dependabot-triggered runs GitHub withholds
      # repository secrets, so ANDROID_KEYSTORE is empty and tauri emits an
      # unsigned APK that the emulator refuses to install
      # (INSTALL_FAILED_INVALID_APK: Failed to extract native libraries).
      # We detect signature state with apksigner and, if needed, debug-sign so
      # E2E can install the APK. Production builds (push to develop/main,
      # human-triggered PRs) keep the original production-signed APK.
      - name: Find and upload Android APK for E2E tests
        run: |
          set -euo pipefail
          echo "Looking for release APK files for E2E tests..."

          # Prefer the canonical universal-release path, fall back to any
          # release APK including *-unsigned.apk (dependabot case).
          APK_PATH=""
          for candidate in \
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk; do
            if [ -f "$candidate" ]; then APK_PATH="$candidate"; break; fi
          done
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" -not -name "*unsigned*" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" -type f 2>/dev/null | head -1)
          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "WARNING: No release APK found for E2E tests"
            echo "APK_FOUND=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Candidate APK: $APK_PATH"

          # Locate latest build-tools (apksigner, zipalign).
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ] || [ -z "$ZIPALIGN" ]; then
            echo "ERROR: apksigner ($APKSIGNER) or zipalign ($ZIPALIGN) not found in $ANDROID_HOME/build-tools"
            exit 1
          fi

          # If apksigner verifies the APK, ship it as-is (production signing
          # was applied). Otherwise debug-sign so E2E can install it.
          if "$APKSIGNER" verify "$APK_PATH" >/dev/null 2>&1; then
            echo "APK is properly signed (production keystore was configured)."
            FINAL_APK="$APK_PATH"
          else
            echo "APK is unsigned (dependabot PR or no keystore configured) - debug-signing for E2E..."

            # Fresh debug keystore valid for the duration of this job.
            keytool -genkey -v \
              -keystore /tmp/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -noprompt

            # zipalign BEFORE apksigner (page-aligned uncompressed native libs
            # are what Android 11+ needs to install without
            # INSTALL_FAILED_INVALID_APK).
            ALIGNED_APK="/tmp/app-aligned.apk"
            "$ZIPALIGN" -p -f -v 4 "$APK_PATH" "$ALIGNED_APK"

            # Sign with v1+v2+v3 schemes; v1-only (jarsigner) is rejected on
            # modern Android.
            FINAL_APK="/tmp/app-e2e.apk"
            "$APKSIGNER" sign \
              --ks /tmp/debug.keystore \
              --ks-pass pass:android \
              --key-pass pass:android \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "$FINAL_APK" \
              "$ALIGNED_APK"

            "$APKSIGNER" verify --verbose "$FINAL_APK"
            echo "Debug-signed APK ready: $FINAL_APK"
          fi

          mkdir -p e2e-apk
          cp "$FINAL_APK" e2e-apk/app-e2e.apk
          echo "Using APK for E2E: e2e-apk/app-e2e.apk"
          echo "APK_FOUND=true" >> "$GITHUB_ENV"

      - name: Upload Android APK for E2E tests
        if: env.APK_FOUND == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: haex-vault-android-e2e
          path: e2e-apk/*.apk
          retention-days: 1

  # Single aggregate gate used as the required check in branch protection.
  # Pragmatic gate (always required): test, build-desktop, build-android.
  # Strict gate (additionally required): e2e-tests, e2e-tests-android.
  # E2E is skipped only for confirmed patch/minor Dependabot updates.
  ci-success:
    name: CI Success
    needs: [check-skip, fmt, test, build-desktop, build-android, e2e-tests, e2e-tests-android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI gate
        env:
          SHOULD_SKIP: ${{ needs.check-skip.outputs.should_skip }}
          SKIP_E2E: ${{ needs.check-skip.outputs.skip_e2e }}
          IS_DEPENDABOT: ${{ needs.check-skip.outputs.is_dependabot }}
          DEP_TYPE: ${{ needs.check-skip.outputs.dep_update_type }}
          FMT: ${{ needs.fmt.result }}
          TEST: ${{ needs.test.result }}
          BUILD_DESKTOP: ${{ needs.build-desktop.result }}
          BUILD_ANDROID: ${{ needs.build-android.result }}
          E2E_DESKTOP: ${{ needs.e2e-tests.result }}
          E2E_ANDROID: ${{ needs.e2e-tests-android.result }}
        run: |
          if [ "$SHOULD_SKIP" = "true" ]; then
            echo "Build intentionally skipped (version bump or broken main) — gate passes"
            exit 0
          fi

          echo "Context: is_dependabot=$IS_DEPENDABOT dep_type='$DEP_TYPE' skip_e2e=$SKIP_E2E"
          echo "Results: fmt=$FMT test=$TEST build-desktop=$BUILD_DESKTOP build-android=$BUILD_ANDROID e2e=$E2E_DESKTOP e2e-android=$E2E_ANDROID"

          fail=0
          require() {
            local name="$1" result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::$name did not succeed (result=$result)"
              fail=1
            fi
          }

          # Pragmatic gate: always required
          require "fmt" "$FMT"
          require "test" "$TEST"
          require "build-desktop" "$BUILD_DESKTOP"
          require "build-android" "$BUILD_ANDROID"

          # Strict gate: E2E required unless this is a patch/minor Dependabot update
          if [ "$SKIP_E2E" = "true" ]; then
            echo "E2E gate relaxed: pragmatic mode for Dependabot $DEP_TYPE"
          else
            require "e2e-tests" "$E2E_DESKTOP"
            require "e2e-tests-android" "$E2E_ANDROID"
          fi

          if [ "$fail" = "1" ]; then
            echo "::error::CI gate failed — see results above"
            exit 1
          fi

          echo "All required jobs passed"
