name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # A direct push to main was previously unchecked. Both jobs below skip
  # their diff-scoped steps when there is no pull-request base to diff against.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation consistency
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check patch whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0

      - name: Install frontend dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Check chat state
        run: corepack pnpm check:chat-state

      - name: Check window manager state
        run: corepack pnpm check:wm-state

      - name: Check window manager navigation
        run: corepack pnpm check:wm-navigation

      - name: Check agent actions
        run: corepack pnpm check:agent-actions

      - name: Check passwords
        run: corepack pnpm check:passwords

      - name: Check storage
        run: corepack pnpm check:storage

      - name: Check contacts
        run: corepack pnpm check:contacts

      - name: Check extensions
        run: corepack pnpm check:extensions

      - name: Check settings app
        run: corepack pnpm check:settings

      - name: Check fields
        run: corepack pnpm check:fields

      - name: Check appearance
        run: corepack pnpm check:appearance

      - name: Check live vault data
        run: corepack pnpm check:vault-data

      - name: Check chat model search
        run: corepack pnpm check:chat-model-search

      - name: Check vault lifecycle
        run: corepack pnpm check:vault-lifecycle

      - name: Check vault passphrase lifetime
        run: corepack pnpm check:vault-passphrase-lifetime

      # The end-to-end suite's own logic (process control, driver client,
      # stand-in provider, report). Needs no display and no application; the
      # scenarios themselves run through `pnpm test:e2e`.
      - name: Check e2e helpers
        run: corepack pnpm check:e2e-lib

      - name: Check the platform probe
        run: corepack pnpm check:platform-probe

      - name: Check the file browser
        run: corepack pnpm check:files

      - name: Check the file icons
        run: corepack pnpm check:file-icons

      - name: Check Android versions against the devShell
        run: corepack pnpm check:android-versions

      - name: Check the e2e exclusions of Android
        run: corepack pnpm check:e2e-exclusions

      # Neither `typecheck` nor `lint` parses template expressions, so an
      # SFC the build cannot compile passes both — one did, and broke
      # `pnpm generate` on main unnoticed. This compiles every template
      # with the build's own compiler, without running a build.
      - name: Check Vue templates compile
        run: corepack pnpm check:templates

      - name: Typecheck frontend
        run: corepack pnpm typecheck

      # `scripts/` sits outside the Nuxt source root, so the step above never
      # sees it. Node runs these files as TypeScript directly (22.19+), which
      # strips types without checking them.
      - name: Typecheck tooling scripts
        run: corepack pnpm typecheck:scripts

      - name: Lint frontend
        run: corepack pnpm lint

      # Prettier's `semi: false` and Vue's template-expression parser
      # disagree about multi-statement inline handlers: Vue collapses an
      # attribute's newlines before parsing, so the inline form needs the
      # `;` separators Prettier strips, and the result fails to compile.
      # Keep such handlers in named functions — see AliasSetting.vue.
      - name: Check frontend formatting
        run: corepack pnpm format:check

      - name: Validate documentation
        run: python3 scripts/ci/check-docs.py

      - name: Test documentation checker
        run: python3 -B -m unittest discover -s scripts/ci -p 'test_*.py'
  build:
    name: Frontend build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0

      - name: Install frontend dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts

      # `typecheck`, `lint` and `format:check` all passed while main could
      # not be built: a template expression the SFC compiler rejects is
      # invisible to every one of them. `check:templates` catches that one
      # class of defect; only a real build catches the rest. This produces
      # exactly what Tauri ships (`frontendDist: ../.output/public`).
      - name: Build frontend
        run: corepack pnpm generate

      - name: Verify the bundle Tauri ships was produced
        run: test -d .output/public/_nuxt

  rust:
    # Two feature sets, two runners, in parallel. Previously one job ran
    # all four cargo invocations back to back and took 19m42s; the
    # default-features half dominates because it builds mistralrs.
    name: Rust checks (${{ matrix.features }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: default
            flags: ''
          - features: no-default
            flags: '--no-default-features'
    env:
      # Backtraces keep file and line, the compiler stops emitting full
      # debug data. This matters less for build time than for cache size:
      # the no-default target tree alone is 5.5 GB at the default
      # `debuginfo=2`, and GitHub evicts caches over 10 GB per repository,
      # which would silently turn the cache below into a no-op.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          # The hosted runner's Azure mirror occasionally stalls for minutes. Use
          # Ubuntu's public mirror so transient regional mirror outages do not
          # fail the job before the build starts.
          sudo sed -i \
            -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            -e 's|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list \
            /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          timeout 10m sudo env DEBIAN_FRONTEND=noninteractive apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          timeout 10m sudo env DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libclang-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # The two feature sets produce different artifacts and must not
          # share one cache entry.
          shared-key: ${{ matrix.features }}

      # Formatting does not depend on features, so it runs on one leg only.
      - name: Check formatting
        if: matrix.features == 'default'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          if [ -n "$base" ] && git diff --quiet "$base...${{ github.sha }}" -- 'src-tauri/**/*.rs'; then
            echo "No Rust files changed; formatting check skipped."
          else
            cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          fi

      # Clippy reuses the dependency artifacts `cargo test` just built —
      # it only wraps workspace crates — so the order here is deliberate.
      # A test binary that crashes (a signal, not a failed test) leaves a core
      # file; the step after this one prints its backtrace.
      - name: Run tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cores
          sudo sysctl -q -w kernel.core_pattern='/tmp/cores/core.%p.%E'
          ulimit -c unlimited
          cargo test --manifest-path src-tauri/Cargo.toml ${{ matrix.flags }}

      - name: Backtrace of a crashed test binary
        if: failure() && steps.tests.outcome == 'failure'
        shell: bash
        run: |
          shopt -s nullglob
          cores=(/tmp/cores/core.*)
          if [ ${#cores[@]} -eq 0 ]; then
            echo 'No test binary crashed.'
            exit 0
          fi
          command -v gdb >/dev/null || timeout 10m sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get install --no-install-recommends -y gdb
          for core in "${cores[@]}"; do
            name="$(basename "$core")"
            name="${name#core.*.}"
            exe="${name//!//}"
            echo "::group::$exe"
            gdb -batch -ex 'info threads' -ex 'thread apply all bt' "$exe" "$core" || true
            echo '::endgroup::'
          done

      # `ts-rs` writes bindings while running the export tests. Normalize the
      # known trailing whitespace and fail when the checked-in TypeScript
      # contract differs from a fresh Rust export (spec 001, types.md §CI).
      - name: Check generated TypeScript bindings
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E 's/[[:space:]]+$//' src/types/bindings/*.ts
          if [ -n "$(git status --short --untracked-files=all -- src/types/bindings)" ]; then
            echo 'Generated bindings differ from the checked-in files or are untracked.' >&2
            git status --short --untracked-files=all -- src/types/bindings >&2
            exit 1
          fi
          git diff --exit-code -- src/types/bindings

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml ${{ matrix.flags }} --all-targets -- -D warnings

  e2e:
    # Builds the debug application (default features, the same profile
    # `pnpm test:e2e` builds locally) and drives it through tauri-driver
    # under a virtual screen (spec 016). `scripts/with-nix-host-bridge.sh`
    # (invoked by `pnpm test:e2e`) is a no-op outside a Nix devShell, so it
    # runs the command unchanged here.
    name: End-to-end suite
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      # Shares the Rust job's default-features cache entry below; the debug
      # build this job produces is that same feature set.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0

      # Every other job only ever runs `corepack pnpm ...`, which needs no
      # shim. This job also runs `pnpm tauri build` (inside `test:e2e`),
      # whose `beforeBuildCommand` spawns a literal `pnpm generate` itself —
      # without a real `pnpm` on PATH that fails with `spawn pnpm ENOENT`.
      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts

      # Same list the Rust job installs, plus the WebKit WebDriver and the
      # virtual screen the suite needs (preflight.ts's REQUIRED_TOOLS), and
      # the GStreamer plugins WebKitGTK plays MP4 (H.264/AAC) and MP3 with
      # (spec 044 files-media).
      - name: Install Linux build dependencies
        run: |
          # The hosted runner's Azure mirror occasionally stalls for minutes. Use
          # Ubuntu's public mirror so transient regional mirror outages do not
          # fail the job before the build starts.
          sudo sed -i \
            -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            -e 's|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list \
            /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          timeout 10m sudo env DEBIAN_FRONTEND=noninteractive apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          timeout 10m sudo env DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libclang-dev \
            webkit2gtk-driver \
            xvfb \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-libav

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: default

      # tauri-driver is a global `cargo install`, outside the workspace the
      # cache step above covers; cached separately by its pinned version so
      # an ordinary run does not recompile it.
      - name: Cache tauri-driver
        id: cache-tauri-driver
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-2.0.6-${{ runner.os }}

      - name: Install tauri-driver
        if: steps.cache-tauri-driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked --version 2.0.6

      - name: Run the end-to-end suite
        run: corepack pnpm test:e2e

      # The relaunch scenario only runs against a release build (`--app`),
      # so this ordinary run always reports it skipped — expected, not a
      # failure (spec 016 SC-001).
      - name: Upload failure material
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure-material
          path: src-tauri/target/e2e
          if-no-files-found: ignore

  # Spec 043 (research R15, contracts/ci.md): holzi for Android. The CI sets up its own Android
  # environment instead of the Nix devShell; `pnpm check:android-versions` (job documentation)
  # keeps the SDK packages, the NDK and the Rust toolchain below equal to the devShell's.
  android-build:
    name: Android build
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0

      # The Tauri CLI runs `beforeBuildCommand` (`pnpm generate`) and Gradle runs `pnpm tauri`
      # by name, so `pnpm` itself has to be on PATH, as in the e2e job.
      - name: Enable corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          # `yes` ends with SIGPIPE once sdkmanager is done, which pipefail would count as a failure.
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "platforms;android-37.0" \
            "build-tools;36.0.0" "build-tools;37.0.0" "ndk;28.2.13676358" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          # openssl-src (SQLCipher) runs ranlib by the target prefix unless told otherwise; the
          # Tauri CLI sets only the compilers.
          ndk="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "RANLIB_aarch64_linux_android=$ndk/llvm-ranlib" >> "$GITHUB_ENV"
          echo "RANLIB_x86_64_linux_android=$ndk/llvm-ranlib" >> "$GITHUB_ENV"

      # bindgen (haex-crdt's SQLCipher hooks) needs libclang on the build host.
      - name: Install Linux build dependencies
        run: |
          # The hosted runner's Azure mirror occasionally stalls for minutes. Use
          # Ubuntu's public mirror so transient regional mirror outages do not
          # fail the job before the build starts.
          sudo sed -i \
            -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            -e 's|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list \
            /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          timeout 10m sudo env DEBIAN_FRONTEND=noninteractive apt-get update -o Acquire::Retries=3
          timeout 10m sudo env DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends libclang-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Spec 044 (T007): with the platform probe, which stays inert unless `debug.holzi.probe` is 1.
      - name: Build the debug APK
        run: corepack pnpm tauri android build --debug --apk --split-per-abi --target aarch64 --target x86_64 --features platform-probe

      - name: Upload the APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: holzi-android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  android-lint:
    name: Android clippy (${{ matrix.features }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: default
            flags: ''
          - features: no-default
            flags: '--no-default-features'
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Android NDK
        run: |
          set -euo pipefail
          # `yes` ends with SIGPIPE once sdkmanager is done, which pipefail would count as a failure.
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null
          ndk="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CC_aarch64_linux_android=$ndk/aarch64-linux-android26-clang"
            echo "CXX_aarch64_linux_android=$ndk/aarch64-linux-android26-clang++"
            echo "AR_aarch64_linux_android=$ndk/llvm-ar"
            # openssl-src (SQLCipher) runs ranlib by the target prefix unless told otherwise.
            echo "RANLIB_aarch64_linux_android=$ndk/llvm-ranlib"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ndk/aarch64-linux-android26-clang"
          } >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        run: |
          # The hosted runner's Azure mirror occasionally stalls for minutes. Use
          # Ubuntu's public mirror so transient regional mirror outages do not
          # fail the job before the build starts.
          sudo sed -i \
            -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            -e 's|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list \
            /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          timeout 10m sudo env DEBIAN_FRONTEND=noninteractive apt-get update -o Acquire::Retries=3
          timeout 10m sudo env DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends libclang-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: android-lint-${{ matrix.features }}

      - name: Run clippy for Android
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --target aarch64-linux-android ${{ matrix.flags }} -- -D warnings

  # Spec 043 (FR-033a, contracts/ci.md): the desktop e2e suite on an Android emulator, in three
  # shards. Scenarios that do not run on Android are listed in scripts/e2e/platform-exclusions.ts.
  android-e2e:
    name: Android end-to-end (${{ matrix.shard }}/3)
    needs: android-build
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # The Nostr test relay is a binary of the holzi crate, built for this machine; it shares the
      # desktop jobs' cache entry.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0

      - name: Enable corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts

      # The relay binary links the holzi crate, which needs the desktop build dependencies.
      # The other devices of a group run on Linux beside the phone (stage 2: mixed groups), so the
      # job also needs what the desktop e2e job has: WebKitWebDriver, Xvfb and tauri-driver.
      - name: Install Linux build dependencies
        run: |
          # The hosted runner's Azure mirror occasionally stalls for minutes (as in the e2e job).
          sudo sed -i \
            -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            -e 's|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list \
            /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          timeout 10m sudo env DEBIAN_FRONTEND=noninteractive apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          timeout 10m sudo env DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev libclang-dev \
            webkit2gtk-driver xvfb

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: default
          save-if: false

      - name: Cache tauri-driver
        id: cache-tauri-driver
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-2.0.6-${{ runner.os }}

      - name: Install tauri-driver
        if: steps.cache-tauri-driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked --version 2.0.6

      # The devices of a group meet through a local iroh relay, since the phone sits behind the
      # emulator's own network (contract e2e-android.md): the `iroh-relay` of the release holzi uses.
      - name: Read the iroh-relay version
        id: iroh-relay
        run: |
          version=$(sed -n '/^name = "iroh-relay"$/{n;s/^version = "\(.*\)"$/\1/p}' src-tauri/Cargo.lock)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache iroh-relay
        id: cache-iroh-relay
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/iroh-relay
          key: iroh-relay-${{ steps.iroh-relay.outputs.version }}-${{ runner.os }}

      - name: Install iroh-relay
        if: steps.cache-iroh-relay.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.iroh-relay.outputs.version }}
        run: cargo install iroh-relay --locked --version "$VERSION" --features server

      - name: Download the APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: holzi-android-debug
          path: ${{ runner.temp }}/apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache the emulator snapshot
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35-google_apis-x86_64-4cores-v1

      - name: Create the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          cores: 4
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "snapshot created"

      - name: Run the e2e suite on the emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          cores: 4
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: scripts/ci/android-e2e.sh ${{ matrix.shard }} 3 ${{ runner.temp }}/apk/x86_64/debug/app-x86_64-debug.apk

      - name: Upload failure material
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-e2e-failure-material-${{ matrix.shard }}
          path: src-tauri/target/e2e
          if-no-files-found: ignore

  # Spec 044 (T007, research R4): may holzi's web view fetch from a server on 127.0.0.1 on Windows
  # and macOS? Local Network Access in WebView2 could forbid it. The probe build reports one line and
  # exits; `scripts/run-platform-probe.ts` judges it. Not a required check until it has run green.
  platform-probe:
    name: Platform probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0

      # The Tauri CLI runs `beforeBuildCommand` (`pnpm generate`), so `pnpm` has to be on PATH.
      - name: Enable corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: platform-probe-${{ matrix.os }}

      # Without local inference and voice: the probe needs neither, and the build stays short. The
      # runner's default shell on purpose: under Git Bash, `perl` is Git's MSYS Perl, which lacks
      # modules openssl-src (SQLCipher) needs; PowerShell finds Strawberry Perl.
      - name: Build holzi with the probe
        run: corepack pnpm tauri build --no-bundle --features platform-probe -- --no-default-features

      - name: Run the probe
        shell: bash
        run: |
          binary=src-tauri/target/release/holzi
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          node scripts/run-platform-probe.ts "$binary"

  # Spec 044 (T007, research R4): the same probe in Android's web view, on the emulator of
  # `android-e2e`. The web view's version is in the job log and in the probe's user agent.
  platform-probe-android:
    name: Platform probe (android)
    needs: android-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0

      - name: Download the APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: holzi-android-debug
          path: ${{ runner.temp }}/apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore the emulator snapshot
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35-google_apis-x86_64-v1

      - name: Run the probe on the emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: scripts/ci/android-platform-probe.sh ${{ runner.temp }}/apk/x86_64/debug/app-x86_64-debug.apk

  # The one required check for Android (contracts/ci.md): green only when the APK builds, clippy
  # passes for Android and every e2e shard passes.
  android:
    name: Android
    if: always()
    needs: [android-build, android-lint, android-e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: All Android jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
