name: Release

# A tag `v<version>` on a commit of main releases HaexVault for every platform. The tag starts, all
# in this one run:
#
#   guard    the tag is on main and equals the app version, so a mistake fails before any build,
#   ci       the whole CI (`ci.yml`) on the tagged commit: desktop and Android end-to-end suites,
#            the Windows and macOS platform probes, Android build and clippy. Unlike branch
#            protection, which leaves the Android jobs optional, every one of them has to pass here,
#   desktop  the installers for Linux, Windows and macOS (`desktop-release.yml`),
#   android  the signed APKs (`android-release.yml`).
#
# The builds run beside the CI to save time; `publish` waits for all of them. Only when every job
# passed does it create the GitHub release (as a draft first, so nobody sees a half-filled one)
# and attach every file plus `SHA256SUMS.txt`. A flaky job is fixed by "Re-run failed jobs" of this
# run; the release does not exist until the run is green.
#
# To release: raise `version` in `src-tauri/tauri.conf.json` and `src-tauri/Cargo.toml` in a pull
# request, merge it, wait for the CI on main, then tag the merge commit (README, "Releases").

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Check the tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A release is a state of main. A tag on a feature branch would publish code that was never
      # reviewed or merged.
      - name: Check the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_SHA (tag $GITHUB_REF_NAME) is not a commit of main"
            exit 1
          fi

      # A tag that disagrees with the app's version would publish installers and APKs that call
      # themselves another release (and an APK that is no update, see `android-release.yml`).
      - name: Check the tag equals the app version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::src-tauri/tauri.conf.json says $version, src-tauri/Cargo.toml says $cargo_version"
            exit 1
          fi
          if [ "$REF_NAME" != "v$version" ]; then
            echo "::error::tag $REF_NAME does not match version $version in src-tauri/tauri.conf.json"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: guard
    uses: ./.github/workflows/ci.yml

  desktop:
    name: Desktop
    needs: guard
    uses: ./.github/workflows/desktop-release.yml
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  android:
    name: Android
    needs: guard
    uses: ./.github/workflows/android-release.yml
    secrets:
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  # A job of its own, so the write token never shares a job with a build or a signing key.
  publish:
    name: Publish the release
    needs: [guard, ci, desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the installers and APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: holzi-{desktop-*,android-release}
          path: files
          merge-multiple: true

      # Draft first: the release becomes visible only after every file is attached. A rerun of this
      # job finds the draft and refills it.
      - name: Create the release and attach the files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          # Fewer files than expected means a build silently uploaded less than it should.
          count=$(find files -type f | wc -l)
          if [ "$count" -ne 9 ]; then
            echo "::error::expected 9 files (3 Linux, 2 Windows, 2 macOS, 2 Android), found $count"
            find files -type f
            exit 1
          fi
          (cd files && sha256sum haexvault-* > SHA256SUMS.txt)
          ls -l files
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "HaexVault $VERSION" --generate-notes
          fi
          gh release upload "$TAG" files/* --clobber
          gh release edit "$TAG" --draft=false
