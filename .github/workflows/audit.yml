name: Audit

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    paths:
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - '.github/workflows/audit.yml'
  schedule:
    - cron: '0 4 * * 1'  # Monday 04:00 UTC — weekly heads-up
  workflow_dispatch:

concurrency:
  group: audit-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # `@stable` matches every other Rust job in this repo (build.yml).
      # `rust-toolchain.toml` is honoured at the first cargo invocation:
      # rustup switches to the pinned channel on demand, so the action
      # preloading stable does not actually drift CI from local dev.
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo-audit
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-v1
      - name: Install cargo-audit (if missing)
        run: |
          if ! command -v cargo-audit > /dev/null; then
            cargo install cargo-audit --locked
          fi
      - name: Run cargo audit
        working-directory: src-tauri
        # Plain `cargo audit` already fails on real vulnerabilities. We do NOT
        # pass `--deny warnings` — unmaintained advisories (especially the
        # GTK3/Tauri transitive stack) would otherwise turn into ~28 CI errors
        # on every PR. Curated vulnerability ignores live in `.cargo/audit.toml`
        # (auto-loaded by cargo-audit; documented per-entry).
        run: cargo audit

  pnpm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run pnpm audit (prod deps only)
        # `--audit-level high` keeps low-severity noise out of the gate.
        # Dev dependencies have larger surface (build tooling) and are excluded — they
        # cannot reach end-user runtime. Revisit if a dev-only advisory is published.
        run: pnpm audit --prod --audit-level high
