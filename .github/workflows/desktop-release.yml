name: Desktop release

# Installers for Linux, Windows and macOS. `release.yml` calls this workflow for a tag `v*` and
# publishes the installers together with the Android APKs once the whole CI is green; this file
# only builds and uploads them as artifacts (`holzi-desktop-<platform>`). `workflow_dispatch`
# builds them without a release. A pull request that changes this file builds them too, so a
# change to the workflow is tried before a tag depends on it.
#
# The installers are not signed yet: Windows SmartScreen and macOS Gatekeeper warn about them.
# macOS signing and notarization switch on by themselves once the repository has the secrets
# APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD
# and APPLE_TEAM_ID (README, "Desktop releases").

on:
  # `release.yml` hands over only the macOS signing secrets; a called workflow sees no secret that
  # is not passed. Without them the build stays unsigned, as in a manual run.
  workflow_call:
    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
  pull_request:
    paths: ['.github/workflows/desktop-release.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Read the app version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A tag that disagrees with the app's version would publish installers that call themselves
      # another release. The Cargo version is the one the binary reports.
      - name: Read the app version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::src-tauri/tauri.conf.json says $version, src-tauri/Cargo.toml says $cargo_version"
            exit 1
          fi
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::tag $REF_NAME does not match version $version in src-tauri/tauri.conf.json"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Installers (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            # Linux links Sherpa as shared libraries (see Cargo.toml); the deb and the rpm have to
            # carry them beside the executable, where its `$ORIGIN` rpath looks.
            args: --config src-tauri/tauri.linux-x86_64.conf.json
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          # Both Mac builds run on an Apple Silicon runner; the Intel one is cross-compiled, so it
          # does not depend on the hosted Intel runners that GitHub is retiring.
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0

      # The Tauri CLI runs `beforeBuildCommand` (`pnpm generate`), so `pnpm` itself has to be on PATH.
      - name: Enable corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: corepack pnpm install --frozen-lockfile

      # The packages Tauri needs on Linux, plus libasound (cpal) and libclang (bindgen for
      # haex-crdt's SQLCipher hooks).
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo sed -i \
            -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            -e 's|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list \
            /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          timeout 10m sudo env DEBIAN_FRONTEND=noninteractive apt-get update -o Acquire::Retries=3
          timeout 10m sudo env DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libclang-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      # Spec 066 (T001): the native sherpa-onnx libraries the `voice` feature links, checked
      # against their pinned SHA-256 (scripts/lib/sherpaOnnxArchives.ts); cargo takes them from
      # `SHERPA_ONNX_ARCHIVE_DIR` and never downloads them itself.
      - name: Fetch sherpa-onnx
        run: node scripts/fetch-sherpa-onnx.ts --target ${{ matrix.target }}

      # macOS signs and notarizes only when the repository has the Apple credentials; Tauri reads
      # them from the environment. Without them the build is unsigned. The certificate is a
      # base64 .p12 file, `APPLE_PASSWORD` an app-specific password of the Apple ID.
      - name: Pass the Apple signing credentials on
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple credentials in the repository: the macOS installer stays unsigned."
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::$name is not set although APPLE_CERTIFICATE is"
              exit 1
            fi
            echo "::add-mask::$value"
            {
              echo "$name<<APPLE_EOF"
              echo "$value"
              echo "APPLE_EOF"
            } >> "$GITHUB_ENV"
          done

      # No cargo cache: releases are rare, and a release build's cache would push the CI's
      # caches out of the repository's 10 GB. Local inference and voice are in on purpose (the
      # default features): the release is the full app. Local inference is llama.cpp (spec 070 US5),
      # built through cmake, which every runner image has; ggml gets the x86-64 AVX2 baseline from
      # `.cargo/config.toml`, the Mac builds Metal. The runner's default shell on Windows on
      # purpose: under Git Bash, `perl` is Git's MSYS Perl, which lacks modules openssl-src
      # (SQLCipher) needs; PowerShell finds Strawberry Perl.
      - name: Build the installers
        env:
          # linuxdeploy's bundled `strip` does not know the newer ELF sections of Ubuntu 24.04.
          NO_STRIP: 'true'
          # The linuxdeploy tools are AppImages themselves; a runner without FUSE runs them by
          # extracting them first.
          APPIMAGE_EXTRACT_AND_RUN: '1'
          # linuxdeploy finds the Sherpa libraries (copied there by sherpa-onnx-sys) through this
          # and puts them into the AppImage; without it: "Could not find dependency".
          LD_LIBRARY_PATH: ${{ github.workspace }}/src-tauri/target/${{ matrix.target }}/release
        # `--verbose` because Tauri prints nothing of linuxdeploy's own output otherwise, and the
        # AppImage step failed on the runner with only "failed to run linuxdeploy".
        run: corepack pnpm tauri build --verbose --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} ${{ matrix.args }}

      # The deb and the AppImage installed without the Sherpa libraries would start into "cannot open
      # shared object file". (The rpm gets the same `files` entries as the deb.)
      - name: Check the Linux installers carry the Sherpa libraries
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bundle="src-tauri/target/$TARGET/release/bundle"
          appimage=$(realpath "$bundle"/appimage/*.AppImage)
          (cd "$RUNNER_TEMP" && "$appimage" --appimage-extract > /dev/null)
          deb=$(dpkg -c "$bundle"/deb/*.deb)
          for lib in libsherpa-onnx-c-api.so libonnxruntime.so; do
            # Listings go through variables: `grep -q` closing a pipe early would fail `pipefail`.
            grep -q "/usr/bin/$lib\$" <<< "$deb" || { echo "::error::the deb lacks $lib"; exit 1; }
            found=$(find "$RUNNER_TEMP/squashfs-root" -name "$lib*")
            [ -n "$found" ] || { echo "::error::the AppImage lacks $lib"; exit 1; }
          done

      # Tauri links the VC runtime statically, so the app starts on a Windows without the Visual C++
      # redistributable. Native code built beside it (llama.cpp, spec 070) must not bring a runtime
      # DLL back: the runners have Visual Studio installed and would never notice.
      - name: Check the app needs no VC++ runtime DLL
        if: runner.os == 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          $exe = Get-ChildItem "src-tauri\target\$env:TARGET\release\*.exe" | Where-Object { $_.Name -in 'holzi.exe', 'HaexVault.exe' } | Select-Object -First 1
          $dlls = & $dumpbin /nologo /dependents $exe.FullName | ForEach-Object { $_.Trim() } | Where-Object { $_ -match '\.dll$' }
          $dlls
          $runtime = $dlls | Where-Object { $_ -match '^(vcruntime|msvcp|vcomp|concrt)\d+' }
          if ($runtime) { Write-Output "::error::$($exe.Name) needs $($runtime -join ', ')"; exit 1 }

      # Every installer is renamed to `haexvault-<version>-<platform>.<ext>`, so a release's files say
      # which machine they are for.
      - name: Collect the installers
        shell: bash
        env:
          PLATFORM: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bundle="src-tauri/target/$TARGET/release/bundle"
          out="$RUNNER_TEMP/installers"
          mkdir -p "$out"
          count=0
          for file in "$bundle"/{deb/*.deb,rpm/*.rpm,appimage/*.AppImage,nsis/*.exe,msi/*.msi,dmg/*.dmg}; do
            [ -f "$file" ] || continue
            ext="${file##*.}"
            cp "$file" "$out/haexvault-$VERSION-$PLATFORM.$ext"
            count=$((count + 1))
          done
          ls -l "$out"
          expected=$(echo '${{ matrix.bundles }}' | tr ',' '\n' | wc -l)
          if [ "$count" -ne "$expected" ]; then
            echo "::error::found $count installers for ${{ matrix.bundles }}"
            find "$bundle" -maxdepth 2 -type f || true
            exit 1
          fi

      - name: Upload the installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: holzi-desktop-${{ matrix.name }}
          path: ${{ runner.temp }}/installers/*
          if-no-files-found: error
          retention-days: 30
